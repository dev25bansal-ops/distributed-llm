# Distributed LLM Configuration

model:
  name: "HuggingFaceTB/SmolLM-135M"
  dtype: "float16"

coordinator:
  host: "0.0.0.0"
  port: 50050
  api_port: 8000

# Distributed worker nodes — each device runs a subset of layers
nodes:
  - node_id: "node_0"
    host: "localhost"
    port: 50051
    start_layer: 0
    end_layer: 3
    device: "cuda:0"

  - node_id: "node_1"
    host: "localhost"
    port: 50052
    start_layer: 4
    end_layer: 7
    device: "cuda:1"

# Generation settings
generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9

# Pipeline parallelism settings
pipeline:
  timeout_seconds: 30.0
  max_retries: 3
  retry_delay: 1.0

# Logging
logging:
  level: "INFO"
  format: "json"

# vLLM backend (use on each worker node for GPU inference)
vllm:
  enabled: true
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_num_seqs: 256

# llama.cpp backend (lighter alternative for CPU/AGPU)
llamacpp:
  enabled: false
  n_gpu_layers: 0
  n_ctx: 2048

# Wide-area network settings (for cross-internet connections)
wide_area:
  enabled: false
  p2p_forwarding: true
  tokens_before_forward: 10
  wan_timeout_seconds: 60.0
  max_retries: 3
  backoff_base_seconds: 1.0

# TLS / Security
tls:
  enabled: false
  cert_dir: "certs"

# Profiles
dev:
  wide_area:
    enabled: true
    tokens_before_forward: 5
    wan_timeout_seconds: 120.0

staging:
  vllm:
    enabled: true
    gpu_memory_utilization: 0.85

production:
  vllm:
    enabled: true
    gpu_memory_utilization: 0.95
    tensor_parallel_size: 1
  tls:
    enabled: true
