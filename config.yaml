# Distributed LLM Configuration

# =============================================================================
# Base configuration (applied to all profiles)
# =============================================================================

model:
  # HuggingFace model name or local path
  name: "roneneldan/TinyStories-1M"
  # Data type for model weights
  dtype: "float16"  # float16, float32, bfloat16

coordinator:
  host: "localhost"
  port: 50050
  # API server
  api_port: 8000

# Worker nodes configuration
nodes:
  - node_id: "node_0"
    host: "localhost"
    port: 50051
    start_layer: 0
    end_layer: 3
    device: "cuda"

  - node_id: "node_1"
    host: "localhost"
    port: 50052
    start_layer: 4
    end_layer: 7
    device: "cuda"

# Generation settings
generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9

# Logging settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json or text

# Network settings
network:
  # gRPC timeout (seconds)
  grpc_timeout: 30
  # Retry settings
  max_retries: 3
  retry_delay: 1.0

# TLS/Security
tls:
  # Security: TLS disabled by default — enable and provide certs for production.
  # When enabled without cert_file/key_file, self-signed certs are auto-generated
  # into cert_dir (suitable for development/testing only).
  enabled: false
  cert_dir: "certs"
  # cert_file: "/path/to/server.crt"   # Override auto-generated cert
  # key_file: "/path/to/server.key"     # Override auto-generated key
  # ca_cert_file: "/path/to/ca.crt"     # CA cert for client verification

# =============================================================================
# Profile-specific overrides
# =============================================================================

dev:
  coordinator:
    api_port: 8000
  batching:
    max_batch_size: 8
    max_tokens_per_batch: 1024
  monitoring:
    enabled: false
  rate_limit:
    enabled: false
  tls:
    enabled: false
  prefix_cache:
    enabled: false

staging:
  batching:
    max_batch_size: 16
    max_tokens_per_batch: 2048
  rate_limit:
    enabled: true
    default_rpm: 30
  monitoring:
    enabled: true
  prefix_cache:
    enabled: true
    radix_tree_enabled: true

production:
  batching:
    max_batch_size: 64
    max_tokens_per_batch: 8192
  rate_limit:
    enabled: true
    default_rpm: 120
    auth_rpm_multiplier: 3.0
  tls:
    enabled: true
  monitoring:
    enabled: true
  prefix_cache:
    enabled: true
    radix_tree_enabled: true
    memory_budget_bytes: 1073741824  # 1 GiB
  cache_persistence:
    enabled: true
    ttl_hours: 24
  priority:
    enabled: true
    preemption_enabled: true
