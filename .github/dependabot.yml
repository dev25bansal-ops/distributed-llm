version: 2
updates:
  # Python ecosystem — grouped, weekly
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # vllm 0.x releases frequently change internal APIs the backend uses;
      # the <0.9.0 cap in pyproject.toml is intentional. Bump manually after
      # testing against the backend integration suite.
      - dependency-name: "vllm"
        versions: [">=0.9.0"]
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — monthly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
