name: Chaos Engineering

on:
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration in seconds'
        default: '3600'
        type: string
      scenarios:
        description: 'Comma-separated scenario names (or "all")'
        default: 'all'
        type: string

env:
  PYTHON_VERSION: '3.11'
  DISTLLM_LOG_LEVEL: 'DEBUG'

jobs:
  chaos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test,chaos]"
          pip install pytest-asyncio pytest-html

      - name: Run chaos scenarios
        id: chaos
        run: |
          python tests/chaos/run_all.py \
            --duration ${{ github.event.inputs.duration || '3600' }} \
            --scenarios ${{ github.event.inputs.scenarios || 'all' }} \
            --output chaos-report.json \
            --junit chaos-results.xml
        continue-on-error: true

      - name: Generate report
        if: always()
        run: |
          python tests/chaos/report.py \
            --input chaos-report.json \
            --output chaos-report.html \
            --format html

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report-${{ github.run_number }}
          path: |
            chaos-report.json
            chaos-report.html
            chaos-results.xml
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: chaos-results.xml
          check_name: Chaos Engineering Results
          comment_mode: always

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('chaos-report.json', 'utf8'));
            } catch (e) {}
            
            const body = `## Chaos Engineering Failure
            
            **Run:** ${context.runId}
            **Duration:** ${{ github.event.inputs.duration || '3600' }}s
            **Scenarios:** ${{ github.event.inputs.scenarios || 'all' }}
            
            ### Results
            - Total: ${report.total || 'N/A'}
            - Passed: ${report.passed || 'N/A'}
            - Failed: ${report.failed || 'N/A'}
            
            ### Failed Scenarios
            ${(report.failures || []).map(f => `- ${f.scenario}: ${f.error}`).join('\n') || 'See workflow logs for details'}
            
            [View full report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Chaos Engineering Failure - Run ${context.runId}`,
              body: body,
              labels: ['chaos', 'automated', 'failure']
            });
