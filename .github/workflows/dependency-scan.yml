# Focus Area 4 — dependency vulnerability gate.
#
# Runs pip-audit against the project's *installed* core dependency set.
# (The `security-deps` job in ci.yml audits a bare environment and therefore
# sees almost nothing — this workflow installs the package first so the real
# dependency tree is audited.)
#
# BLOCKING GATE (SEC-4, flipped 2026-09-12): the core dependency set was
# audited clean at flip time (52 packages, 0 known advisories via
# pip-audit 2.10.1). If a future advisory needs a temporary waiver, pass
# `--ignore-vuln <ID>` in the pip-audit step AND record the waiver + expiry
# in docs/_audit/ISSUES_CATALOG_CURRENT.md — silent waivers are not allowed.

name: Dependency Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan Mondays 06:23 UTC (off-the-hour to reduce load spikes).
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Check requirements.lock covers every core dependency
        # The Docker image installs requirements.lock, not pyproject, so a core
        # dependency missing from the lock produces an image that builds fine
        # and fails at runtime. Caught transformers, grpcio/protobuf and
        # python-multipart this way one 20-minute rebuild at a time.
        run: python scripts/ci/check_lock_completeness.py

      - name: Install project (core dependency set)
        # Core deps only (fastapi, uvicorn, pydantic, httpx, pyjwt, numpy, ...).
        # Heavy extras (torch/vllm) are intentionally excluded to keep this
        # fast; add extras here if their trees need coverage too.
        run: pip install .

      - name: Run pip-audit (blocking)
        run: |
          # filelock 4.1.0 advisories (17 CVEs) are waived with expiry: 4.2.1
          # does not exist on PyPI (4.1.0 is the latest release), filelock is a
          # CI-tooling transitive dep (CacheControl <- pip-audit), NOT a project
          # runtime dep, and the audit env is ephemeral. Setuptools advisories
          # are fixed by the >=84.1.0 floor in pyproject.toml.
          # Waiver expiry 2026-12-06: re-check upstream; if 4.2.1 ships, drop
          # the waiver and floor filelock>=4.2.1 instead.
          # NOTE: --ignore-vuln takes exactly one ID per flag (pip-audit CLI).
          pip-audit --strict --desc --format json --output dep-audit.json \
            --ignore-vuln CVE-2026-112906 --ignore-vuln CVE-2026-112907 --ignore-vuln CVE-2026-112908 --ignore-vuln CVE-2026-112909 --ignore-vuln CVE-2026-112910 --ignore-vuln CVE-2026-112911 --ignore-vuln CVE-2026-112912 --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112914 --ignore-vuln CVE-2026-112915 --ignore-vuln CVE-2026-112934 --ignore-vuln CVE-2026-112935 --ignore-vuln CVE-2026-112937 --ignore-vuln CVE-2026-112938 --ignore-vuln CVE-2026-112939 --ignore-vuln CVE-2026-112940 --ignore-vuln CVE-2026-112941
          pip-audit --desc \
            --ignore-vuln CVE-2026-112906 --ignore-vuln CVE-2026-112907 --ignore-vuln CVE-2026-112908 --ignore-vuln CVE-2026-112909 --ignore-vuln CVE-2026-112910 --ignore-vuln CVE-2026-112911 --ignore-vuln CVE-2026-112912 --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112914 --ignore-vuln CVE-2026-112915 --ignore-vuln CVE-2026-112934 --ignore-vuln CVE-2026-112935 --ignore-vuln CVE-2026-112937 --ignore-vuln CVE-2026-112938 --ignore-vuln CVE-2026-112939 --ignore-vuln CVE-2026-112940 --ignore-vuln CVE-2026-112941

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-audit-report
          path: dep-audit.json
          if-no-files-found: ignore
