# Focus Area 4 — dependency vulnerability gate.
#
# Runs pip-audit against the project's *installed* core dependency set.
# (The `security-deps` job in ci.yml audits a bare environment and therefore
# sees almost nothing — this workflow installs the package first so the real
# dependency tree is audited.)
#
# BLOCKING GATE (SEC-4, flipped 2026-09-12): the core dependency set was
# audited clean at flip time (52 packages, 0 known advisories via
# pip-audit 2.10.1). If a future advisory needs a temporary waiver, pass
# `--ignore-vuln <ID>` in the pip-audit step AND record the waiver + expiry
# in docs/_audit/ISSUES_CATALOG_CURRENT.md — silent waivers are not allowed.

name: Dependency Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan Mondays 06:23 UTC (off-the-hour to reduce load spikes).
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Install project (core dependency set)
        # Core deps only (fastapi, uvicorn, pydantic, httpx, pyjwt, numpy, ...).
        # Heavy extras (torch/vllm) are intentionally excluded to keep this
        # fast; add extras here if their trees need coverage too.
        run: pip install .

      - name: Run pip-audit (blocking)
        run: |
          pip-audit --strict --desc --format json --output dep-audit.json
          pip-audit --desc

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-audit-report
          path: dep-audit.json
          if-no-files-found: ignore
