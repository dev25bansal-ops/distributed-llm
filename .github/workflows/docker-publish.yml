# Publish the DistLLM runtime image to GitHub Container Registry.
#
# Why a separate workflow: the image was previously built only from
# release.yml, which (a) triggers only on `v*` tags -- none have ever been
# created -- and (b) gates the build on a `build-test` job running
# `ruff check src/`, `mypy src/` and `--cov-fail-under=80`, none of which pass
# on this tree. The net effect was that no image has ever been published to
# GHCR (verified: the package does not exist).
#
# This workflow publishes on every push to master and on manual dispatch, and
# verifies the resulting image actually starts before declaring success.

name: Publish Docker image

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - "Dockerfile.cuda*"
      - "docker-entrypoint.sh"
      - "pyproject.toml"
      - "requirements.lock"
      - "src/**"
      - ".github/workflows/docker-publish.yml"
  # Build (but do not push) on pull requests, so a broken image is caught
  # before it merges rather than after. GHCR requires the workflow to exist on
  # the default branch before workflow_dispatch can reach it, so the pull_request
  # trigger is also how this gets exercised the first time.
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile"
      - "Dockerfile.cuda*"
      - "docker-entrypoint.sh"
      - "pyproject.toml"
      - "requirements.lock"
      - "src/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag (default: short SHA)"
        required: false
        default: ""

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          extra="${{ inputs.tag }}"
          {
            echo "image=ghcr.io/${owner}/distributed-llm"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/distributed-llm:${version}"
            echo "ghcr.io/${owner}/distributed-llm:sha-${short_sha}"
            [ -n "$extra" ] && echo "ghcr.io/${owner}/distributed-llm:${extra}"
            if [ "${GITHUB_REF_NAME}" = "master" ]; then
              echo "ghcr.io/${owner}/distributed-llm:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "building ${version} (${short_sha})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # A pull request validates the build; only master publishes.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CUDA_VERSION=12.8.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image starts
        # The image must answer /health. A push that produces an image which
        # cannot start is worse than no push: it looks successful.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Nothing was pushed, so build locally under the same tag.
            docker build -t verify-image --build-arg CUDA_VERSION=12.8.0 -f Dockerfile .
            IMAGE=verify-image
          else
            IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            docker pull "$IMAGE"
          fi
          docker run -d --name verify \
            -e DISTLLM_MODEL=roneneldan/TinyStories-1M \
            -v /tmp/model-cache:/root/.cache/huggingface \
            "$IMAGE" \
            distllm-api --model roneneldan/TinyStories-1M --local --port 8000 --host 0.0.0.0
          for i in $(seq 1 90); do
            if docker exec verify curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "image is healthy after ${i}s"
              docker logs verify --tail 20
              exit 0
            fi
            sleep 2
          done
          echo "::error::published image did not become healthy"
          docker logs verify || true
          exit 1

      - name: Image summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Published image

          \`\`\`
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          ${{ steps.meta.outputs.image }}:latest
          \`\`\`

          Pull and run:

          \`\`\`bash
          docker run --gpus all -p 8000:8000 \
            ghcr.io/${{ github.repository_owner }}/distributed-llm:${{ steps.meta.outputs.version }}
          \`\`\`
          EOF