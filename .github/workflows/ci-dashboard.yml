# CI Dashboard — Publish test results to GitHub Pages
#
# Aggregates test results, coverage, benchmarks, and security scans
# into a browsable dashboard hosted on GitHub Pages.
#
# Access at: https://distributed-llm.github.io/ci-dashboard/

name: CI Dashboard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI", "GPU Tests", "Chaos Engineering", "Benchmark Regression"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['CI', 'GPU Tests', 'Chaos Engineering', 'Benchmark Regression'];
            for (const wf of workflows) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow: wf,
                per_page: 1,
              });
              if (runs.data.workflow_runs.length > 0) {
                const runId = runs.data.workflow_runs[0].id;
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                });
                console.log(`Found ${artifacts.data.artifacts.length} artifacts for ${wf}`);
              }
            }

      - name: Generate dashboard HTML
        run: |
          mkdir -p dashboard/dist
          python -c "
          import json
          import datetime

          now = datetime.datetime.now(datetime.timezone.utc).isoformat()

          dashboard = {
              'generated_at': now,
              'commit': '${{ github.sha }}',
              'branch': '${{ github.ref_name }}',
              'sections': [
                  {
                      'title': 'Test Results',
                      'description': 'Unit, integration, and E2E test results',
                      'icon': 'test',
                      'link': 'tests/',
                  },
                  {
                      'title': 'Coverage Report',
                      'description': 'Code coverage analysis',
                      'icon': 'coverage',
                      'link': 'coverage/',
                  },
                  {
                      'title': 'Benchmark Results',
                      'description': 'Performance benchmarks and regression analysis',
                      'icon': 'benchmark',
                      'link': 'benchmarks/',
                  },
                  {
                      'title': 'Security Scans',
                      'description': 'SAST, dependency audit, and secrets detection',
                      'icon': 'security',
                      'link': 'security/',
                  },
                  {
                      'title': 'Chaos Engineering',
                      'description': 'Chaos test results and resilience metrics',
                      'icon': 'chaos',
                      'link': 'chaos/',
                  },
                  {
                      'title': 'Load Tests',
                      'description': 'Locust load test results and SLO compliance',
                      'icon': 'load',
                      'link': 'load/',
                  },
              ],
          }

          with open('dashboard/dist/index.json', 'w') as f:
              json.dump(dashboard, f, indent=2)
          "

      - name: Generate dashboard HTML page
        run: |
          cat > dashboard/dist/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>DistLLM CI Dashboard</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
                  .header { background: #161b22; padding: 24px 32px; border-bottom: 1px solid #30363d; }
                  .header h1 { font-size: 24px; color: #f0f6fc; }
                  .header p { color: #8b949e; margin-top: 4px; }
                  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 32px; }
                  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; transition: border-color 0.2s; }
                  .card:hover { border-color: #58a6ff; }
                  .card h2 { font-size: 18px; color: #f0f6fc; margin-bottom: 8px; }
                  .card p { color: #8b949e; font-size: 14px; }
                  .card a { display: inline-block; margin-top: 12px; color: #58a6ff; text-decoration: none; }
                  .card a:hover { text-decoration: underline; }
                  .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
                  .status.pass { background: #1a4d2e; color: #3fb950; }
                  .status.fail { background: #4d1a1a; color: #f85149; }
                  .status.warn { background: #4d3a1a; color: #d29922; }
                  .meta { color: #484f58; font-size: 12px; margin-top: 24px; text-align: center; }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>DistLLM CI Dashboard</h1>
                  <p>Build: <code id="commit">loading...</code> | Branch: <code id="branch">loading...</code></p>
              </div>
              <div class="grid" id="sections"></div>
              <div class="meta" id="meta"></div>
              <script>
                  fetch('index.json').then(r => r.json()).then(data => {
                      document.getElementById('commit').textContent = data.commit?.substring(0, 8) || 'N/A';
                      document.getElementById('branch').textContent = data.branch || 'N/A';
                      document.getElementById('meta').textContent = 'Generated: ' + data.generated_at;
                      const grid = document.getElementById('sections');
                      data.sections?.forEach(s => {
                          grid.innerHTML += '<div class="card"><h2>' + s.title + '</h2><p>' + s.description + '</p><a href="' + s.link + '">View Results →</a></div>';
                      });
                  });
              </script>
          </body>
          </html>
          HTMLEOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-dashboard
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
