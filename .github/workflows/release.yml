name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,testing]"
      - run: ruff check src/
      - run: black --check src/
      - run: mypy src/
      - run: pytest -v --cov=distllm --cov-report=xml --cov-fail-under=85 -m "not e2e and not slow"

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-test]
    strategy:
      matrix:
        cuda: ["12.1", "12.6", "12.8"]
    steps:
      - uses: actions/checkout@v4
      - name: Set Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.cuda }}" = "12.8" ]; then
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile.cuda${{ matrix.cuda }}" >> $GITHUB_OUTPUT
          fi
      - name: Set image tags
        id: image_tags
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/coordinator:${{ github.ref_name }}-cuda${{ matrix.cuda }}"
            echo "ghcr.io/${{ github.repository_owner }}/coordinator:${version}-cuda${{ matrix.cuda }}"
            echo "ghcr.io/${{ github.repository_owner }}/coordinator:latest-cuda${{ matrix.cuda }}"
            if [ "${{ matrix.cuda }}" = "12.8" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/coordinator:${version}"
              echo "ghcr.io/${{ github.repository_owner }}/coordinator:latest"
              echo "ghcr.io/${{ github.repository_owner }}/operator:${version}"
              echo "ghcr.io/${{ github.repository_owner }}/operator:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}.0
            DISTLLM_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Sign image with cosign
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_TAGS: ${{ steps.image_tags.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            cosign sign "$image" --yes
          done <<< "$IMAGE_TAGS"

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/* --non-interactive --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-integrations:
    runs-on: ubuntu-latest
    needs: [build-test]
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: distllm-langchain
            path: integrations/langchain
          - name: distllm-llamaindex
            path: integrations/llamaindex
          - name: distllm-crewai
            path: integrations/crewai
          - name: distllm-litellm
            path: integrations/litellm
          - name: distllm-haystack
            path: integrations/haystack
          - name: distllm-autogen
            path: integrations/autogen
          - name: distllm-ollama-compat
            path: integrations/ollama_compat
          - name: distllm-fastapi
            path: integrations/fastapi_middleware
          - name: distllm-semantic-kernel
            path: integrations/semantic_kernel
          - name: distllm-grpc-client
            path: integrations/grpc_client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build twine
      - name: Build ${{ matrix.package.name }}
        working-directory: ${{ matrix.package.path }}
        run: python -m build
      - name: Publish ${{ matrix.package.name }}
        working-directory: ${{ matrix.package.path }}
        run: twine upload dist/* --non-interactive --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-helm:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
      - name: Package chart
        run: helm package deploy/helm/
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: "*.tgz"

  generate-sbom:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py -e . -o sbom.json --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  publish-vscode:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: extensions/vscode
      - run: npx vsce package
        working-directory: extensions/vscode
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: distllm-vsix
          path: extensions/vscode/*.vsix
      - name: Publish to Marketplace
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }}
        working-directory: extensions/vscode

  create-release:
    runs-on: ubuntu-latest
    needs: [build-docker, publish-pypi, publish-helm, generate-sbom, publish-vscode]
    steps:
      - uses: actions/checkout@v4
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Download Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            *.tgz
            sbom.json
