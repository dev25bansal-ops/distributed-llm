name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,testing]"
      - run: ruff check src/
      - run: black --check src/
      - run: mypy src/
      - run: pytest -v --cov=distllm --cov-report=xml --cov-fail-under=75 -m "not e2e and not slow"

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-test]
    strategy:
      matrix:
        cuda: ["12.1", "12.6", "12.8"]
    steps:
      - uses: actions/checkout@v4
      - name: Set Dockerfile
        id: dockerfile
        run: |
          if [ "${{ matrix.cuda }}" = "12.8" ]; then
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile.cuda${{ matrix.cuda }}" >> $GITHUB_OUTPUT
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/coordinator:${{ github.ref_name }}-cuda${{ matrix.cuda }}
            ghcr.io/${{ github.repository }}/coordinator:latest-cuda${{ matrix.cuda }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}.0
            DISTLLM_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/* --non-interactive
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-helm:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v3
      - name: Package chart
        run: helm package deploy/helm/
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: "*.tgz"

  generate-sbom:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py -e . -o sbom.json --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  create-release:
    runs-on: ubuntu-latest
    needs: [build-docker, publish-pypi, publish-helm, generate-sbom]
    steps:
      - uses: actions/checkout@v4
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Download Helm chart
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            *.tgz
            sbom.json
