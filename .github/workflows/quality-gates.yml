# Quality Gates — blocking ratchets (§6.6.1 + §6.6.2)
#
# Runs on every PR and fails the build when:
#   * Bandit finds a NEW HIGH/MEDIUM SAST finding (no-new-violation ratchet).
#   * Per-module coverage drops below the ratcheted floor
#     (global 30% ratcheting +5%/sprint; critical modules held higher
#     via scripts/ci/coverage-ratchet.json).

name: Quality Gates

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit-ratchet:
    name: Bandit no-new-violation ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install bandit
      # Fails on any NEW HIGH/MEDIUM finding vs bandit-baseline.json.
      - name: Run bandit ratchet (blocking)
        run: python scripts/ci/bandit_ratchet.py
      - name: Upload raw bandit report (always)
        if: always()
        run: bandit -r src/ -lll -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  coverage-ratchet:
    name: Coverage ratchet (per-module floors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,testing]"
      - uses: ./.github/actions/generate-protobuf
      - name: Run tests with coverage
        # Coverage is the signal here, not pass/fail: long-standing stale
        # suites (tests/cli, chaos HA) fail on master and would abort the job
        # before coverage.xml exists. The ratchet step below is the blocking
        # gate. Runs are CHUNKED per top-level test dir: a single 12k-test
        # process is OOM-killed on the 7 GB runner (exit 137), so each group
        # runs in its own pytest process and appends to the same coverage data
        # file (--cov-append), then one final `coverage xml` renders the report.
        continue-on-error: true
        run: |
          set +e
          rm -f .coverage coverage.xml
          run_group() {
            [ -e "$1" ] || return 0
            echo "=== coverage chunk: $1 ==="
            pytest "$1" \
              -m "not e2e and not slow and not chaos and not benchmark" \
              --cov=distllm --cov-append --cov-report= \
              --continue-on-collection-errors \
              -q
          }
          # Every top-level test directory in its own process. A previous
          # version ran "everything not listed" as one catch-all chunk, and
          # that chunk alone was still OOM-killed (exit 137) -- which silently
          # dropped tests/dist and ~30 other dirs from the coverage report and
          # made the ratchet see 0.0% for them.
          for g in \
            tests/api tests/backends tests/benchmark tests/benchmarks \
            tests/cache tests/chaos tests/cli tests/client tests/cloud \
            tests/communication tests/comprehensive tests/config tests/core \
            tests/correctness tests/dashboard tests/deploy tests/dist \
            tests/distributed tests/errors tests/evaluation tests/features \
            tests/fuzz tests/health tests/infrastructure tests/integration \
            tests/integrations tests/lint tests/load tests/manual \
            tests/models tests/mutation tests/observability tests/partition \
            tests/performance tests/plugins tests/property \
            tests/regression_high tests/sdk tests/security \
            tests/stability tests/utils tests/verification ; do
            run_group "$g"
          done
          # Root-level tests/*.py that belong to no directory.
          pytest tests/ \
            -m "not e2e and not slow and not chaos and not benchmark" \
            --cov=distllm --cov-append --cov-report= \
            --continue-on-collection-errors \
            --ignore-glob='tests/*/' -q
          python -m coverage xml -o coverage.xml || echo "coverage xml failed"

      - name: Assert coverage.xml was produced
        run: |
          test -f coverage.xml || { echo "::error::pytest produced no coverage.xml"; exit 1; }
          echo "coverage.xml present: $(wc -c < coverage.xml) bytes"
      - name: Enforce coverage ratchet (single blocking gate)
        # The ratchet is the ONLY coverage gate. It FAILS only when total
        # coverage regresses below the recorded baseline (see
        # .coverage-baseline.json) — no hard 80% pytest-cov floor. Emits coverage-delta.md.
        run: python scripts/ci/coverage_ratchet.py --coverage-xml coverage.xml --emit-delta
      - name: Upload coverage delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-delta
          path: coverage-delta.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ratchet-report
          path: coverage.xml
