# Benchmark regression workflow — runs on every PR to catch performance regressions.
# Runs pytest-benchmark tests + custom regression checks with flame graph generation.
# Stores baselines as artifacts for cross-commit comparison.

name: Benchmark Regression

on:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benchmarks/**"

jobs:
  # ── Run benchmarks and compare against baseline ────────────────
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev,testing]"

      - name: Download previous baseline
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmarks/
        continue-on-error: true

      - name: Run pytest benchmarks
        run: |
          python -m pytest tests/benchmark/ -v \
            --benchmark-json=benchmarks/results.json \
            --benchmark-autosave=distllm \
            -p no:asyncio

      - name: Run custom regression check
        run: |
          python benchmarks/regression_check.py \
            --baseline benchmarks/baseline.json \
            --current benchmarks/results.json \
            --threshold 0.10 \
            --flamegraph \
            --git-aware \
            --run || true

      - name: Generate comparison table
        if: github.event_name == 'pull_request'
        run: |
          python -c "
          import json, os

          current_path = 'benchmarks/results.json'
          baseline_path = 'benchmarks/baseline.json'

          if not os.path.exists(current_path):
              print('No benchmark results found')
              exit(0)

          with open(current_path) as f:
              current = json.load(f)

          benchmarks = current.get('benchmarks', [])
          if not benchmarks:
              print('No benchmarks in results')
              exit(0)

          # Build markdown table
          lines = ['## Benchmark Results', '',
                   '| Benchmark | Mean (ms) | StdDev | Min | Max | Rounds |',
                   '|-----------|-----------|--------|-----|-----|--------|']

          for b in benchmarks:
              name = b.get('name', 'unknown')
              stats = b.get('stats', {})
              mean_ms = stats.get('mean', 0) * 1000
              stddev_ms = stats.get('stddev', 0) * 1000
              min_ms = stats.get('min', 0) * 1000
              max_ms = stats.get('max', 0) * 1000
              rounds = stats.get('rounds', 0)
              lines.append(f'| {name} | {mean_ms:.2f} | {stddev_ms:.2f} | {min_ms:.2f} | {max_ms:.2f} | {rounds} |')

          # Compare with baseline if available
          if os.path.exists(baseline_path):
              with open(baseline_path) as f:
                  baseline = json.load(f)
              base_benchmarks = {b['name']: b for b in baseline.get('benchmarks', [])}
              regressions = []
              for b in benchmarks:
                  name = b.get('name', '')
                  if name in base_benchmarks:
                      base_mean = base_benchmarks[name]['stats']['mean']
                      curr_mean = b['stats']['mean']
                      if base_mean > 0:
                          change = ((curr_mean - base_mean) / base_mean) * 100
                          if change > 10:
                              regressions.append((name, change))
              if regressions:
                  lines.extend(['', '### Regressions Detected', ''])
                  for name, change in regressions:
                      lines.append(f'- **{name}**: +{change:.1f}% slower')

          report = '\\n'.join(lines)
          with open('benchmarks/benchmark_report.md', 'w') as f:
              f.write(report)
          print(report)
          "

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmarks/results.json
            benchmarks/flamegraph_*.svg
            benchmarks/regression_report.md
            benchmarks/benchmark_report.md

      - name: Save as new baseline (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmarks/results.json
          overwrite: true

      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = '';
            if (fs.existsSync('benchmarks/benchmark_report.md')) {
              body = fs.readFileSync('benchmarks/benchmark_report.md', 'utf8');
            }
            if (fs.existsSync('benchmarks/regression_report.md')) {
              body += '\n\n' + fs.readFileSync('benchmarks/regression_report.md', 'utf8');
            }
            if (body) {
              // Find and update existing comment or create new
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.data.find(c =>
                c.user.type === 'Bot' && c.body.includes('Benchmark Results')
              );
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            }
