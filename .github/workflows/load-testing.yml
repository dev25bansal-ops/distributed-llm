# Load Testing Pipeline
#
# Deploys a real model and runs Locust load tests against it.
# Verifies SLO compliance: p95 latency < 5s, error rate < 1%.
# Runs on PRs touching core code and on-demand for capacity planning.

name: Load Testing

on:
  pull_request:
    paths:
      - "src/distllm/core/**"
      - "src/distllm/api/**"
      - "src/distllm/backends/**"
  workflow_dispatch:
    inputs:
      users:
        description: "Number of concurrent users"
        default: "10"
        required: false
      duration:
        description: "Test duration (e.g., 2m, 5m)"
        default: "2m"
        required: false
      model:
        description: "Model to test"
        default: "roneneldan/TinyStories-1M"
        required: false

env:
  MODEL_NAME: ${{ github.event.inputs.model || 'roneneldan/TinyStories-1M' }}
  USERS: ${{ github.event.inputs.users || '10' }}
  DURATION: ${{ github.event.inputs.duration || '2m' }}

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,testing]"
          pip install locust

      - name: Verify GPU/CPU availability
        run: |
          python -c "
          import torch
          if torch.cuda.is_available():
              print(f'GPU: {torch.cuda.get_device_name(0)}')
          else:
              print('Running in CPU mode (slower)')
          "

      - name: Start API server
        run: |
          distllm-api --model ${{ env.MODEL_NAME }} --local --port 8000 &
          echo "Server PID: $!"
          # Wait for server to be ready
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Server failed to start"
              exit 1
            fi
            sleep 2
          done

      - name: Run chat load test
        run: |
          locust -f tests/load/locust/scenarios/chat_scenario.py \
            --headless \
            -u ${{ env.USERS }} \
            -r 2 \
            --run-time ${{ env.DURATION }} \
            --host http://localhost:8000 \
            --csv tests/load/results/chat \
            --html tests/load/results/chat_report.html \
            --only-summary

      - name: Run streaming load test
        run: |
          locust -f tests/load/locust/scenarios/streaming_scenario.py \
            --headless \
            -u ${{ env.USERS }} \
            -r 2 \
            --run-time ${{ env.DURATION }} \
            --host http://localhost:8000 \
            --csv tests/load/results/streaming \
            --html tests/load/results/streaming_report.html \
            --only-summary

      - name: Run mixed workload test
        run: |
          locust -f tests/load/locust/scenarios/mixed_scenario.py \
            --headless \
            -u $(( ${{ env.USERS }} * 2 )) \
            -r 4 \
            --run-time ${{ env.DURATION }} \
            --host http://localhost:8000 \
            --csv tests/load/results/mixed \
            --html tests/load/results/mixed_report.html \
            --only-summary

      - name: Generate load test report
        run: |
          python -c "
          import csv
          import os

          results_dir = 'tests/load/results'
          scenarios = ['chat', 'streaming', 'mixed']

          lines = ['# Load Test Results', '']
          all_passed = True

          for scenario in scenarios:
              csv_path = os.path.join(results_dir, f'{scenario}_stats.csv')
              if not os.path.exists(csv_path):
                  lines.append(f'## {scenario.title()} — No data')
                  continue

              with open(csv_path) as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      if row.get('Name') == 'Aggregated':
                          p95 = float(row.get('95%', 0))
                          failures = int(row.get('Failure Count', 0))
                          requests = int(row.get('Request Count', 0))
                          error_rate = (failures / max(requests, 1)) * 100

                          p95_ok = p95 < 5000  # 5s SLO
                          error_ok = error_rate < 1.0  # 1% SLO

                          lines.append(f'## {scenario.title()}')
                          lines.append(f'- Requests: {requests}')
                          lines.append(f'- p95 latency: {p95:.0f}ms {\"✅\" if p95_ok else \"❌ FAIL (SLO: <5000ms)\"}')
                          lines.append(f'- Error rate: {error_rate:.2f}% {\"✅\" if error_ok else \"❌ FAIL (SLO: <1%)\"}')
                          lines.append('')

                          if not p95_ok or not error_ok:
                              all_passed = False

          report = '\\n'.join(lines)
          with open(os.path.join(results_dir, 'load_report.md'), 'w') as f:
              f.write(report)
          print(report)

          if not all_passed:
              print('\\n❌ SLO violations detected!')
              exit(1)
          else:
              print('\\n✅ All SLOs met!')
          "

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: tests/load/results/

      - name: Comment PR with load test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'tests/load/results/load_report.md';
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
