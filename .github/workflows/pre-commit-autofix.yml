name: Pre-commit Auto-Fix
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files || true
      - name: Commit fixes (advisory - never fails the job)
        continue-on-error: true
        run: |
          git config user.name "pre-commit-ci"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No fixes needed."
            exit 0
          fi
          git commit -m "[pre-commit] Auto-fix formatting and lint"
          # PR checkouts are detached HEAD (merge ref) - a push cannot work and
          # must not fail the job. Only push when a real branch is checked out.
          if [ -n "$(git symbolic-ref --short -q HEAD)" ]; then
            git push || echo "push skipped (no write access / protected branch)"
          else
            echo "Detached HEAD (PR merge ref) - skipping push; autofix is advisory."
          fi
