syntax = "proto3";

package distllm;

message TensorProto {
  repeated int32 shape = 1;
  string dtype = 2;
  bytes raw_data = 3;
  repeated float data = 4;
}

message KVCacheProto {
  message LayerCache {
    TensorProto key_states = 1;
    TensorProto value_states = 2;
  }
  repeated LayerCache layers = 1;
}

message ForwardPassRequest {
  string request_id = 1;
  repeated int32 input_ids = 2;
  TensorProto hidden_states = 3;
  TensorProto attention_mask = 4;
  TensorProto position_ids = 5;
  KVCacheProto kv_cache = 6;
  bool use_cache = 7;
  bool is_first_pass = 8;
  repeated int32 draft_tokens = 9;
  int32 batch_size = 10;
  int32 seq_len = 11;
  bool is_last_pass = 12;
  string model_name = 13;
}

message ForwardPassResponse {
  string request_id = 1;
  TensorProto output = 2;
  KVCacheProto kv_cache = 3;
  bool success = 4;
  string error_message = 5;
  int32 error_code = 6;
  bool is_logits = 7;
  float processing_time_ms = 8;
}

message HealthCheckRequest {
  string node_id = 1;
}

message HealthCheckResponse {
  bool healthy = 1;
  string node_id = 2;
  int64 memory_used_bytes = 3;
  int64 memory_total_bytes = 4;
  float gpu_utilization = 5;
  int32 start_layer = 6;
  int32 end_layer = 7;
  int32 total_layers = 8;
  string gpu_name = 9;
  int64 gpu_memory_total = 10;
  int32 num_layers_loaded = 11;
}

message ProfileRequest {
  string node_id = 1;
}

message ProfileResponse {
  string node_id = 1;
  string gpu_name = 2;
  int64 total_memory_bytes = 3;
  int64 free_memory_bytes = 4;
  float compute_tflops = 5;
  float memory_bandwidth_gbps = 6;
  int32 sm_count = 7;
}

service NodeService {
  rpc ForwardPass(ForwardPassRequest) returns (ForwardPassResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Profile(ProfileRequest) returns (ProfileResponse);
}
