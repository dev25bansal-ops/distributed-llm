[package]
name = "distributed-llm"
version = "0.4.0"
description = "Distributed LLM Desktop - Pool GPUs across machines"
authors = ["Distributed LLM Contributors"]
edition = "2021"

[lib]
name = "distributed_llm_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# NVML on Linux
nvml-wrapper = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# NVML on Windows
nvml-wrapper = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
