repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(tests/|benchmarks/|\.secrets\.baseline)

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-r', 'src/distllm/']
        additional_dependencies: ['bandit[toml]']

  - repo: https://github.com/pylint-dev/pyroma
    rev: "4.2"
    hooks:
      - id: pyroma

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: ['types-PyYAML', 'types-psutil', 'pydantic']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: relaxed, rules: {line-length: disable}}']
        files: ^deploy/.*\.(yaml|yml)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: helm-lint
        name: helm-lint
        entry: bash -c 'helm lint deploy/helm/ --quiet 2>/dev/null || echo "Helm lint skipped (not installed)"'
        language: system
        files: ^deploy/helm/
        pass_filenames: false
        always_run: false
        verbose: true
