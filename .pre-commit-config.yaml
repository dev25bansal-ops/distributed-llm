repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^\.secrets\.baseline$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        # Gate blocks NEW findings only. -b compares against the 419-entry
        # baseline (2026-11-07) that captures pre-existing issues across the
        # codebase; a finding absent from the baseline fails the hook.
        # Regenerate the baseline ONLY with a reviewed delta (like a lockfile).
        # pre-commit must NOT pass filenames (bandit -r walks the tree itself).
        pass_filenames: false
        args: ['-c', 'pyproject.toml', '-r', 'src/distllm/', '-b', '.bandit-baseline.json', '-q']
        additional_dependencies: ['bandit[toml]']
        exclude: ^\.bandit-baseline\.json$

  - repo: https://github.com/regebro/pyroma
    rev: "4.2"
    hooks:
      - id: pyroma

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: ['types-PyYAML', 'types-psutil', 'pydantic', 'pydantic-settings']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: relaxed, rules: {line-length: disable}}']
        files: ^deploy/.*\.(yaml|yml)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args: [--desc, --requirement, requirements.txt, --fail-on, HIGH]

  - repo: local
    hooks:
      - id: helm-lint
        name: helm-lint
        entry: bash -c 'helm lint integrations/kubernetes/helm/distllm/ --quiet 2>/dev/null || echo "Helm lint skipped (not installed)"'
        language: system
        files: ^integrations/kubernetes/helm/.*\.(yaml|yml|tpl)$
        pass_filenames: false
        always_run: false
        verbose: true
