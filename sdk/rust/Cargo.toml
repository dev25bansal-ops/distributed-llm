[package]
name = "distllm-sdk"
version = "0.4.0"
edition = "2021"
description = "Rust SDK for Distributed LLM inference"
license = "Apache-2.0"
keywords = ["llm", "inference", "distributed", "openai"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
