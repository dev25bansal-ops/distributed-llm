openapi: "3.1.0"
info:
  title: DistLLM API
  version: "0.4.0"
  description: |
    OpenAI-compatible REST API for distributed LLM inference across
    multiple machines using pipeline parallelism.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.distllm.dev
    description: Production

security:
  - BearerAuth: []

paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/completions:
    post:
      operationId: createCompletion
      summary: Create a text completion
      tags: [Completion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"

  /v1/embeddings:
    post:
      operationId: createEmbedding
      summary: Create embeddings
      tags: [Embedding]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Embedding response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"

  /v1/models:
    get:
      operationId: listModels
      summary: List available models
      tags: [Models]
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"

  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [System]
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/batch:
    post:
      operationId: processBatch
      summary: Process multiple requests concurrently (synchronous batch)
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncBatchRequest"
      responses:
        "200":
          description: Batch processing complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncBatchResponse"

  /v1/batch/submit:
    post:
      operationId: submitBackgroundBatch
      summary: Submit a batch for background processing
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackgroundBatchSubmitRequest"
      responses:
        "202":
          description: Batch submitted for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundBatchSubmitResponse"

  /v1/batch/{batch_id}/status:
    get:
      operationId: getBatchStatus
      summary: Get status of a background batch
      tags: [Batch]
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundBatchStatusResponse"

  /v1/batch/{batch_id}/stream:
    get:
      operationId: streamBatchResults
      summary: Stream results of a background batch via SSE
      tags: [Batch]
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string

  /v1/batch/{batch_id}/cancel:
    post:
      operationId: cancelBatch
      summary: Cancel a background batch
      tags: [Batch]
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundBatchCancelResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        model:
          type: string
          default: distributed-llm
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 0.7
        top_p:
          type: number
          minimum: 0
          maximum: 1
          default: 0.9
        max_tokens:
          type: integer
          minimum: 1
          default: 256
        stream:
          type: boolean
          default: false
        response_format:
          type: object
          properties:
            type:
              type: string
              enum: [text, json_object, json_schema]
        adapter:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
        stop:
          type: array
          items:
            type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
        name:
          type: string
        tool_call_id:
          type: string

    ChatCompletionResponse:
      type: object
      required: [id, model, choices]
      properties:
        id:
          type: string
        model:
          type: string
        created:
          type: integer
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatChoice"
        usage:
          $ref: "#/components/schemas/UsageInfo"
        generation_time:
          type: number

    ChatChoice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
          enum: [stop, length, tool_calls]

    CompletionRequest:
      type: object
      required: [prompt]
      properties:
        model:
          type: string
          default: distributed-llm
        prompt:
          type: string
        temperature:
          type: number
          default: 0.7
        max_tokens:
          type: integer
          default: 256
        stream:
          type: boolean
          default: false

    CompletionResponse:
      type: object
      required: [id, model, choices]
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/CompletionChoice"
        usage:
          $ref: "#/components/schemas/UsageInfo"

    CompletionChoice:
      type: object
      properties:
        index:
          type: integer
        text:
          type: string
        finish_reason:
          type: string

    EmbeddingRequest:
      type: object
      required: [input]
      properties:
        model:
          type: string
          default: distributed-llm
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string

    EmbeddingResponse:
      type: object
      properties:
        model:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmbeddingObject"
        usage:
          $ref: "#/components/schemas/UsageInfo"

    EmbeddingObject:
      type: object
      properties:
        index:
          type: integer
        embedding:
          type: array
          items:
            type: number

    ModelList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"

    ModelInfo:
      type: object
      properties:
        id:
          type: string
        owned_by:
          type: string
        created:
          type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string
        model:
          type: string
        nodes:
          type: integer
        uptime:
          type: number

    SyncBatchRequest:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/SyncBatchRequestItem"
          maxItems: 100
          description: List of requests (max 100)

    SyncBatchRequestItem:
      type: object
      required: [method, body]
      properties:
        method:
          type: string
          enum: [chat, completion, embedding]
          description: Request method
        body:
          type: object
          description: Request body (same as individual endpoint)
        request_id:
          type: string
          description: Optional client-assigned request ID

    SyncBatchResponse:
      type: object
      required: [batch_id, total_requests, successful, failed, total_latency_ms, results]
      properties:
        batch_id:
          type: string
        total_requests:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        total_latency_ms:
          type: number
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncBatchResultItem"

    SyncBatchResultItem:
      type: object
      required: [request_id, status, latency_ms]
      properties:
        request_id:
          type: string
        status:
          type: string
          enum: [success, error]
        result:
          type: object
        error:
          type: string
        latency_ms:
          type: number

    BackgroundBatchSubmitRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackgroundBatchItem"
          maxItems: 500
          description: List of items to process (max 500)
        webhook_url:
          type: string
          description: URL to POST batch results to on completion
        webhook_token:
          type: string
          description: Bearer token for the webhook call
        item_timeout:
          type: number
          minimum: 1.0
          maximum: 600.0
          default: 30.0
          description: Per-item timeout in seconds (default 30s, max 600s)

    BackgroundBatchItem:
      type: object
      required: [prompt]
      properties:
        request_id:
          type: string
          description: Optional client-assigned request ID
        prompt:
          type: string
          description: Prompt text to send to the model
        max_tokens:
          type: integer
          minimum: 1
          maximum: 32768
          default: 128
          description: Maximum tokens to generate
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          default: 0.7
          description: Sampling temperature

    BackgroundBatchSubmitResponse:
      type: object
      required: [batch_id, status, total_items, created_at, message]
      properties:
        batch_id:
          type: string
        status:
          type: string
          enum: [pending, running]
        total_items:
          type: integer
        created_at:
          type: number
        message:
          type: string
        cancelled_items:
          type: integer

    BackgroundBatchStatusResponse:
      type: object
      required: [batch_id, status, total_items, pending, running, completed, failed, timed_out, cancelled, total_cost, created_at]
      properties:
        batch_id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, partially_completed, cancelled]
        total_items:
          type: integer
        pending:
          type: integer
        running:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        timed_out:
          type: integer
        cancelled:
          type: integer
        total_cost:
          type: number
        created_at:
          type: number
        completed_at:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackgroundBatchItemResult"

    BackgroundBatchItemResult:
      type: object
      required: [request_id, status, cost]
      properties:
        request_id:
          type: string
        prompt:
          type: string
        max_tokens:
          type: integer
        temperature:
          type: number
        status:
          type: string
          enum: [pending, running, completed, failed, timeout, cancelled]
        result:
          type: object
        error:
          type: string
        cost:
          type: number
        started_at:
          type: number
        completed_at:
          type: number

    BackgroundBatchCancelResponse:
      type: object
      required: [batch_id, status, cancelled_items, message]
      properties:
        batch_id:
          type: string
        status:
          type: string
        cancelled_items:
          type: integer
        message:
          type: string

    UsageInfo:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cost_usd:
          type: number
        tokens_per_second:
          type: number

    Tool:
      type: object
      properties:
        type:
          type: string
        function:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
