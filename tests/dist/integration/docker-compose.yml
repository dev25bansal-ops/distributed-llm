version: "3.9"

# Integration test cluster for distributed LLM inference.
#
# Spins up a coordinator + 2 worker nodes, then runs the test suite
# against the live cluster.
#
# Usage:
#   docker compose -f tests/dist/integration/docker-compose.yml up --build -d
#   python -m pytest tests/dist/integration/ -v
#   docker compose -f tests/dist/integration/docker-compose.yml down

services:
  coordinator:
    build:
      context: ../../..
      dockerfile: Dockerfile
    ports:
      - "50050:50050"
      # The CI job polls http://localhost:8000/v1/health from the host, so the
      # API port has to be published. Without it the curl loop could never
      # succeed no matter how healthy the container was.
      - "8000:8000"
    environment:
      - DISTLLM_LOG_LEVEL=DEBUG
      # Not a settings field -- the coordinator section is nested, so the
      # working form is DISTLLM_COORDINATOR__API_PORT. The host default is
      # "localhost", which inside a container is unreachable through a
      # published port.
      - DISTLLM_COORDINATOR__API_PORT=8000
      - DISTLLM_COORDINATOR__HOST=0.0.0.0
      # Shared cluster key: the gRPC servicers fail closed without one
      # (node_service._check_auth), so both sides must agree.
      - DISTLLM_CLUSTER_KEY=integration-test-key
      # Server-side admin key. Without it the store auto-generates one into
      # /app/.distllm/api_key inside the container, which the test-runner
      # cannot read -- every authenticated route would 401. API_KEY (not
      # DISTLLM_API_KEY) is the name the server's settings read.
      - API_KEY=integration-test-api-key
    # distllm-api, not distllm-coordinator: the coordinator CLI parses the
    # right flags but starts NO HTTP listener -- Coordinator.start() only
    # starts background threads and mDNS. The healthcheck below and every
    # test poll http://localhost:8000/v1/health, and workers register over
    # HTTP at /admin/v1/nodes/register, so the process must serve HTTP.
    # distllm-api (api/server_coordinator.py) is the only entrypoint that
    # both serves the REST API on 8000 AND starts the coordinator gRPC
    # NodeServer on 50050 that the workers connect to.
    command: >
      distllm-api
        --host 0.0.0.0
        --port 8000
        --model roneneldan/TinyStories-1M
        --nodes node_0:50051:0:3 node_1:50052:4:7
        --total-layers 8
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node_0:
    build:
      context: ../../..
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      - DISTLLM_LOG_LEVEL=DEBUG
      # Shared cluster key: the gRPC servicers fail closed without one
      # (node_service._check_auth), so both sides must agree.
      - DISTLLM_CLUSTER_KEY=integration-test-key
    command: >
      distllm-node
        --node-id node_0
        --model roneneldan/TinyStories-1M
        --start-layer 0
        --end-layer 3
        --total-layers 8
        --port 50051
        --coordinator-host coordinator
        --coordinator-port 50050
        --insecure
    depends_on:
      coordinator:
        condition: service_healthy

  node_1:
    build:
      context: ../../..
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    environment:
      - DISTLLM_LOG_LEVEL=DEBUG
      # Shared cluster key: the gRPC servicers fail closed without one
      # (node_service._check_auth), so both sides must agree.
      - DISTLLM_CLUSTER_KEY=integration-test-key
    command: >
      distllm-node
        --node-id node_1
        --model roneneldan/TinyStories-1M
        --start-layer 4
        --end-layer 7
        --total-layers 8
        --port 50052
        --coordinator-host coordinator
        --coordinator-port 50050
        --insecure
    depends_on:
      coordinator:
        condition: service_healthy

  test-runner:
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: >
      python -m pytest tests/dist/integration/ -v --junitxml=/results/results.xml
    environment:
      - COORDINATOR_URL=http://coordinator:8000
      - DISTLLM_LOG_LEVEL=WARNING
      # Tests send this as a Bearer token (TEST_API_KEY in conftest/_url).
      - TEST_API_KEY=integration-test-api-key
      - DISTLLM_CLUSTER_KEY=integration-test-key
    volumes:
      - ../../../tests/dist/integration:/app/tests/dist/integration
      - test-results:/results
    depends_on:
      coordinator:
        condition: service_healthy
      node_0:
        condition: service_started
      node_1:
        condition: service_started
    profiles:
      - test

volumes:
  test-results:
