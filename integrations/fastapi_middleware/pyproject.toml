[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm-fastapi"
version = "0.1.0"
description = "FastAPI middleware for DistLLM — drop-in LLM proxy for any FastAPI/Flask app"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DistLLM Contributors" },
]
keywords = ["distllm", "fastapi", "middleware", "llm", "distributed", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "uvicorn>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/distllm_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
