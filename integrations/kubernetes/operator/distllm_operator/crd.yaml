apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: distllmclusters.distllm.ai
spec:
  group: distllm.ai
  names:
    kind: DistLLMCluster
    plural: distllmclusters
    singular: distllmcluster
    shortNames:
      - dlc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  default: 1
                  description: Number of worker nodes
                model:
                  type: string
                  default: "distributed-llm"
                  description: Model to serve
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "4"
                    memory:
                      type: string
                      default: "16Gi"
                    gpu:
                      type: string
                      default: "1"
              required: []
      subresources:
        status: {}
