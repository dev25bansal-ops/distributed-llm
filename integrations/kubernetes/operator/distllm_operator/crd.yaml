apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: distllmclusters.distllm.ai
spec:
  group: distllm.ai
  names:
    kind: DistLLMCluster
    plural: distllmclusters
    singular: distllmcluster
    shortNames:
      - dlc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 0
                  default: 1
                  description: Number of worker nodes
                model:
                  type: string
                  default: "distributed-llm"
                  description: Model to serve
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "4"
                    memory:
                      type: string
                      default: "16Gi"
                    gpu:
                      type: string
                      default: "1"
              required: []
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current cluster phase (Pending, Deploying, Running, Scaling, Error)"
                  enum:
                    - Pending
                    - Deploying
                    - Running
                    - Scaling
                    - Partial
                    - Error
                readyWorkers:
                  type: integer
                  description: Number of ready worker pods
                activeModel:
                  type: string
                  description: Currently loaded model
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready Workers
          type: integer
          jsonPath: .status.readyWorkers
        - name: Model
          type: string
          jsonPath: .status.activeModel
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
