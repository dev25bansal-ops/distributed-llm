replicaCount: 1

image:
  repository: distributed-llm
  tag: latest
  pullPolicy: IfNotPresent

service:
  rest:
    port: 8000
  grpc:
    port: 50051
  metrics:
    port: 9090

resources:
  limits:
    cpu: 8
    memory: 32Gi
    nvidia.com/gpu: 1
  requests:
    cpu: 2
    memory: 8Gi

env:
  DISTLLM_LOG_LEVEL: info
  DISTLLM_COORDINATOR_HOST: "0.0.0.0"

persistence:
  models:
    enabled: true
    size: 100Gi
    storageClass: ""
  cache:
    enabled: true
    size: 50Gi
    storageClass: ""

redis:
  enabled: true
  address: ""
  password: ""
  # SECURITY: In production, always set a strong Redis password via --set redis.password=...
  # If no password is set and Redis is enabled, a random password is auto-generated
  # and stored in a Kubernetes Secret when using the Helm chart with rbac enabled.

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  # 4.5 — GPU-aware autoscaling
  scalingMetric: "cpu"  # "cpu", "memory", "gpu_utilization"
  targetGPUUtilization: 75
  scaleDownDelay: "5m"
  scaleUpPolicy: "aggressive"  # "aggressive" or "conservative"

serviceMonitor:
  enabled: false
  interval: 15s

ingress:
  enabled: false
  host: distllm.example.com
  tls: {}

# GPU scheduling — set tolerations and nodeAffinity so pods land on GPU nodes
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

nodeSelector: {}

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: accelerator
              operator: In
              values:
                - nvidia-tesla-a100
                - nvidia-tesla-v100
                - nvidia-a100-80gb

# Network segmentation
networkPolicy:
  enabled: true
  # Allow ingress from within the cluster on REST + gRPC ports
  allowedNamespaces: []

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # alternative to minAvailable

# RBAC — ServiceAccount, Role, RoleBinding
rbac:
  create: true

# Security context for the distllm container
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
