{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distllm.fullname" . }}
  labels:
    {{- include "distllm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "distllm.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow REST API from within the cluster
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.rest.port }}
          protocol: TCP
        - port: {{ .Values.service.grpc.port }}
          protocol: TCP
    # Allow metrics scraping from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: {{ .Values.service.metrics.port }}
          protocol: TCP
    {{- range .Values.networkPolicy.allowedNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: {{ $.Values.service.rest.port }}
          protocol: TCP
    {{- end }}
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow inter-pod communication within the namespace
    - to:
        - podSelector: {}
{{- end }}
