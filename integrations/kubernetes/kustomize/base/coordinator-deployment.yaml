apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  labels:
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: coordinator
    spec:
      serviceAccountName: distllm-coordinator
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z distllm-redis 6379; do echo waiting for redis; sleep 2; done
      containers:
        - name: coordinator
          image: distributed-llm:latest
          imagePullPolicy: IfNotPresent
          args:
            - coordinator
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 50051
              name: grpc
            - containerPort: 9090
              name: metrics
          env:
            - name: DISTLLM_CONFIG
              value: /etc/distllm/distllm.yaml
            - name: DISTLLM_LOG_LEVEL
              value: info
            - name: DISTLLM_COORDINATOR_HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: config
              mountPath: /etc/distllm
            - name: models
              mountPath: /data/models
            - name: cache
              mountPath: /data/cache
          resources:
            requests:
              cpu: 2
              memory: 8Gi
            limits:
              cpu: 8
              memory: 32Gi
              nvidia.com/gpu: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: distllm-config
        - name: models
          persistentVolumeClaim:
            claimName: distllm-models
        - name: cache
          persistentVolumeClaim:
            claimName: distllm-cache
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: accelerator
                    operator: In
                    values:
                      - nvidia-tesla-a100
                      - nvidia-a100-80gb
