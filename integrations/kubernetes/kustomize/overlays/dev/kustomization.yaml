apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: dev-

commonLabels:
  environment: dev
  app.kubernetes.io/environment: dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: coordinator
    path: coordinator-patch.yaml
  - target:
      kind: Deployment
      name: worker
    path: coordinator-patch.yaml
  - target:
      kind: HorizontalPodAutoscaler
      name: coordinator
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: worker
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: ConfigMap
      name: config
    patch: |-
      - op: replace
        path: /data/distllm.yaml
        value: |
          coordinator:
            host: "0.0.0.0"
          log_level: debug
          redis:
            address: "dev-distllm-redis:6379"

replicas:
  - name: coordinator
    count: 1
  - name: worker
    count: 1
