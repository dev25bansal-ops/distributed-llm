[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm-crewai"
version = "0.1.0"
description = "CrewAI integration for DistLLM — Tools, LLM, Embeddings, and Knowledge Source"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DistLLM Contributors" },
]
keywords = ["distllm", "crewai", "llm", "distributed", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "crewai>=0.30.0",
    "distllm>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.entry-points."crewai.tools"]
distllm = "distllm_crewai.tools:DistLLMToolProvider"

[project.entry-points."crewai.llm"]
distllm = "distllm_crewai.llm:DistLLMCrewLLM"

[tool.hatch.build.targets.wheel]
packages = ["src/distllm_crewai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
