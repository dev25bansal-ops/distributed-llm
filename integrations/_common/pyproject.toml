[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm-common-adapter"
version = "0.1.0"
description = "Shared adapter utilities for DistLLM framework integrations — BaseToolProvider, CostTracker, DistLLMModelRouter"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DistLLM Contributors" },
]
keywords = ["distllm", "adapter", "integrations", "llm", "distributed", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
