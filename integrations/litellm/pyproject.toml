[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm-litellm"
version = "0.1.0"
description = "LiteLLM provider for DistLLM — use DistLLM as a backend in LiteLLM's unified proxy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DistLLM Contributors" },
]
keywords = ["distllm", "litellm", "llm", "distributed", "inference", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "litellm>=1.40.0",
    "distllm>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/distllm_litellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
