[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm-langchain"
version = "0.1.0"
description = "LangChain integration for DistLLM — ChatModel, LLM, Embeddings, and Tool provider"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DistLLM Contributors" },
]
keywords = ["distllm", "langchain", "llm", "distributed", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain-core>=0.3.0",
    "distllm>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "langchain>=0.3.0",
]

[project.entry-points."langchain.llms"]
distllm = "distllm_langchain.llms:DistLLM"

[project.entry-points."langchain.chat_models"]
distllm = "distllm_langchain.chat_models:DistLLMChat"

[project.entry-points."langchain.embeddings"]
distllm = "distllm_langchain.embeddings:DistLLMEmbeddings"

[tool.hatch.build.targets.wheel]
packages = ["src/distllm_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
