[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distllm-ollama-compat"
version = "0.1.0"
description = "Ollama-compatible API proxy for DistLLM — use any Ollama client with DistLLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DistLLM Contributors" },
]
keywords = ["distllm", "ollama", "llm", "distributed", "inference", "compatibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
distllm-ollama-proxy = "distllm_ollama.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/distllm_ollama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
