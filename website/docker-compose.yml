# Docker Compose for DistLLM Website
# Includes website, analytics, and monitoring

version: '3.8'

services:
  # Website
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: distllm-website
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - website-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - distllm-net

  # Plausible Analytics (privacy-respecting)
  plausible:
    image: plausible/analytics:latest
    container_name: distllm-analytics
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@analytics-db:5432/plausible
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DISABLE_REGISTRATION=invite_only
    depends_on:
      - analytics-db
    networks:
      - distllm-net

  # Analytics Database
  analytics-db:
    image: postgres:15-alpine
    container_name: distllm-analytics-db
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}  # REQUIRED: Set via environment
      - POSTGRES_DB=plausible
    volumes:
      - analytics-data:/var/lib/postgresql/data
    networks:
      - distllm-net

  # Redis for caching (no host port — internal only)
  redis:
    image: redis:7-alpine
    container_name: distllm-redis
    restart: unless-stopped
    # Ports are not exposed to host — internal to Docker network only.
    # For debugging, uncomment:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - distllm-net

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: distllm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - distllm-net

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: distllm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.distllm.dev
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - distllm-net

volumes:
  website-logs:
  analytics-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  distllm-net:
    driver: bridge
