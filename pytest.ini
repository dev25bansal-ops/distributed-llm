[pytest]
asyncio_mode = auto
timeout = 60
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore:The pynvml package is deprecated:FutureWarning
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    e2e: marks tests as end-to-end tests (deselect with '-m "not e2e"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    memory: marks tests as memory profiling tests
    chaos: marks tests as chaos engineering tests
    benchmark: marks tests as benchmark tests
    security: marks tests as security tests
    property: marks tests as property-based tests (hypothesis)
    sdk: marks tests as SDK client tests
    cli: marks tests as CLI tests
