services:
  coordinator:
    build: .
    ports:
      - "50050:50050"   # coordinator gRPC (worker registration)
      - "8000:8000"     # OpenAI-compatible REST API + /health /ready /live
    command: >
      distllm-api
        --host 0.0.0.0
        --port 8000
        --model roneneldan/TinyStories-1M
        --nodes node_0:50051:0:3 node_1:50052:4:7
        --total-layers 8
    environment:
      # Workers fail closed without a cluster key (node_service.py:199).
      # Set DISTLLM_CLUSTER_KEY in .env for anything beyond a local demo.
      DISTLLM_CLUSTER_KEY: ${DISTLLM_CLUSTER_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  node_0:
    build: .
    ports:
      - "50051:50051"
    command: >
      distllm-node
        --node-id node_0
        --coordinator-host coordinator
        --coordinator-port 50050
        --model roneneldan/TinyStories-1M
        --start-layer 0
        --end-layer 3
        --total-layers 8
        --port 50051
        --insecure
    environment:
      DISTLLM_CLUSTER_KEY: ${DISTLLM_CLUSTER_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  node_1:
    build: .
    ports:
      - "50052:50052"
    command: >
      distllm-node
        --node-id node_1
        --coordinator-host coordinator
        --coordinator-port 50050
        --model roneneldan/TinyStories-1M
        --start-layer 4
        --end-layer 7
        --total-layers 8
        --port 50052
        --insecure
    environment:
      DISTLLM_CLUSTER_KEY: ${DISTLLM_CLUSTER_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
