services:
  coordinator:
    build: .
    ports:
      - "50050:50050"
    command: >
      distllm
        --model roneneldan/TinyStories-1M
        --port 50050
        --nodes node_0:50051:0:3 node_1:50052:4:7
        --total-layers 8
    depends_on:
      node_0:
        condition: service_healthy
      node_1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:50050/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  node_0:
    build: .
    ports:
      - "50051:50051"
    command: >
      distllm-node
        --node-id node_0
        --model roneneldan/TinyStories-1M
        --start-layer 0
        --end-layer 3
        --total-layers 8
        --port 50051
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50051), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  node_1:
    build: .
    ports:
      - "50052:50052"
    command: >
      distllm-node
        --node-id node_1
        --model roneneldan/TinyStories-1M
        --start-layer 4
        --end-layer 7
        --total-layers 8
        --port 50052
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50052), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
