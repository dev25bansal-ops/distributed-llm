<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistLLM Model Registry</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-green: #2ea043;
            --accent-red: #da3633;
            --accent-blue: #388bfd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg-primary); color: var(--text-primary); margin: 0; padding: 16px;
        }
        .container { max-width: 1600px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);
        }
        header h1 { font-size: 1.4rem; color: var(--accent-blue); }
        .header-right { display: flex; gap: 12px; align-items: center; }

        .btn {
            padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border-color);
            background: var(--bg-card); color: var(--text-primary); cursor: pointer;
            font-size: 0.8rem; transition: background 0.2s;
        }
        .btn:hover { background: #30363d; }
        .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .btn-primary:hover { background: #58a6ff; }
        .btn-green { background: var(--accent-green); border-color: var(--accent-green); color: #fff; }
        .btn-green:hover { background: #3fb950; }
        .btn-red { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }
        .btn-red:hover { background: #f85149; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #status-badge {
            padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 600;
        }
        #status-badge.ok { background: #0d5320; color: #7ee787; }
        #status-badge.error { background: #7f1d1d; color: #fca5a5; }
        #status-badge.loading { background: #713f12; color: #fde68a; }

        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 16px;
        }
        .summary-card {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 14px;
        }
        .summary-card .label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .summary-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
        .summary-card .value.blue { color: var(--accent-blue); }
        .summary-card .value.green { color: var(--accent-green); }
        .summary-card .value.red { color: var(--accent-red); }

        .section-title {
            font-size: 1rem; margin: 20px 0 12px; color: var(--text-primary);
        }

        .model-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px; margin-bottom: 16px;
        }
        .model-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
        }
        .model-card-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .model-card-header h3 { font-size: 0.9rem; font-weight: 600; }

        .badge {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .badge-loaded { background: #0d5320; color: #7ee787; }
        .badge-unloaded { background: #3d1f1f; color: #fca5a5; }
        .badge-cached { background: #1f3d5a; color: #79c0ff; }

        .model-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.78rem; color: var(--text-secondary);
        }
        .model-row .val { color: var(--text-primary); font-weight: 500; }

        .mem-bar {
            height: 8px; background: var(--border-color); border-radius: 4px; overflow: hidden; margin-top: 4px;
        }
        .mem-bar-fill {
            height: 100%; border-radius: 4px; transition: width 0.5s;
        }
        .mem-bar-fill.blue { background: var(--accent-blue); }
        .mem-bar-fill.green { background: var(--accent-green); }
        .mem-bar-fill.red { background: var(--accent-red); }

        .cluster-chart {
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 14px; margin-bottom: 16px;
        }
        .cluster-chart h2 { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .cluster-chart .chart-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
        .cluster-chart .chart-label { font-size: 0.8rem; min-width: 80px; color: var(--text-secondary); }
        .cluster-chart .chart-bar { flex: 1; height: 20px; background: var(--border-color); border-radius: 4px; overflow: hidden; display: flex; }
        .cluster-chart .chart-used { background: var(--accent-blue); height: 100%; transition: width 0.5s; }
        .cluster-chart .chart-free { background: #30363d; height: 100%; }
        .cluster-chart .chart-val { font-size: 0.8rem; font-weight: 600; min-width: 70px; text-align: right; }

        .toggle-row {
            display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-secondary);
        }
        .toggle { position: relative; width: 36px; height: 20px; cursor: pointer; }
        .toggle input { display: none; }
        .toggle-slider {
            position: absolute; inset: 0; background: var(--border-color); border-radius: 10px; transition: 0.2s;
        }
        .toggle-slider::before {
            content: ""; position: absolute; width: 16px; height: 16px; left: 2px; bottom: 2px;
            background: var(--text-primary); border-radius: 50%; transition: 0.2s;
        }
        .toggle input:checked + .toggle-slider { background: var(--accent-blue); }
        .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

        .empty-state { padding: 40px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }

        .action-btns { display: flex; gap: 6px; margin-top: auto; }

        .toast {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 10px 16px; border-radius: 6px; font-size: 0.8rem;
            opacity: 0; transition: opacity 0.3s; z-index: 999;
        }
        .toast.show { opacity: 1; }
        .toast.ok { border-left: 4px solid var(--accent-green); }
        .toast.err { border-left: 4px solid var(--accent-red); }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Model Registry</h1>
        <div class="header-right">
            <div class="toggle-row">
                <label class="toggle">
                    <input type="checkbox" id="auto-refresh" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span>Auto-refresh (10s)</span>
            </div>
            <button class="btn btn-primary" id="refresh-btn" onclick="refresh()">Refresh</button>
            <span id="status-badge" class="ok">OK</span>
        </div>
    </header>

    <div class="summary-grid" id="summary-cards"></div>

    <h2 class="section-title">Cluster GPU Memory</h2>
    <div class="cluster-chart" id="cluster-chart">
        <div class="chart-row">
            <span class="chart-label">GPU Memory</span>
            <div class="chart-bar">
                <div class="chart-used" id="chart-used" style="width:0%"></div>
                <div class="chart-free" id="chart-free"></div>
            </div>
            <span class="chart-val" id="chart-val">0 / 0 MB</span>
        </div>
    </div>

    <h2 class="section-title">Models</h2>
    <div class="model-grid" id="model-grid"></div>
</div>

<div id="toast" class="toast"></div>

<script>
(function() {
    'use strict';

    const ids = {};
    function el(id) { if (!ids[id]) ids[id] = document.getElementById(id); return ids[id]; }

    function esc(s) { return String(s).replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

    function fmt(n, d) { return typeof n === 'number' ? n.toFixed(d != null ? d : 1) : '--'; }
    function fmtMB(b) { return typeof b === 'number' ? (b / (1024*1024)).toFixed(1) : '--'; }

    let autoRefresh = true;
    let refreshTimer = null;

    el('auto-refresh').addEventListener('change', function() {
        autoRefresh = this.checked;
        if (autoRefresh) { scheduleRefresh(); }
        else { clearTimeout(refreshTimer); }
    });

    function scheduleRefresh() {
        clearTimeout(refreshTimer);
        if (autoRefresh) {
            refreshTimer = setTimeout(function() { refresh(); }, 10000);
        }
    }

    function showToast(msg, type) {
        var t = el('toast');
        t.textContent = msg;
        t.className = 'toast show ' + (type || 'ok');
        setTimeout(function() { t.className = 'toast'; }, 3000);
    }

    function setStatus(text, cls) {
        var sb = el('status-badge');
        sb.textContent = text;
        sb.className = cls || 'ok';
    }

    function renderSummary(data) {
        var container = el('summary-cards');
        var cards = [
            { label: 'Total Models', value: data.models.length, cls: 'blue' },
            { label: 'Loaded Models', value: data.models_loaded_count, cls: 'green' },
            { label: 'Cached Models', value: data.models_cached, cls: 'blue' },
            { label: 'Cluster Nodes', value: data.cluster_nodes, cls: 'blue' },
        ];
        container.innerHTML = '';
        cards.forEach(function(c) {
            var card = document.createElement('div');
            card.className = 'summary-card';
            var lbl = document.createElement('div');
            lbl.className = 'label';
            lbl.textContent = c.label;
            card.appendChild(lbl);
            var val = document.createElement('div');
            val.className = 'value ' + c.cls;
            val.textContent = c.value;
            card.appendChild(val);
            container.appendChild(card);
        });
    }

    function renderCluster(data) {
        var total = data.total_gpu_memory_mb || 0;
        var used = data.used_gpu_memory_mb || 0;
        var pct = total > 0 ? Math.min((used / total) * 100, 100) : 0;
        el('chart-used').style.width = pct + '%';
        el('chart-val').textContent = fmt(used, 0) + ' / ' + fmt(total, 0) + ' MB';
    }

    function renderModels(data) {
        var container = el('model-grid');
        container.innerHTML = '';
        if (!data.models || !data.models.length) {
            var empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.textContent = 'No models registered.';
            container.appendChild(empty);
            return;
        }
        data.models.forEach(function(m) {
            var card = document.createElement('div');
            card.className = 'model-card';

            var header = document.createElement('div');
            header.className = 'model-card-header';

            var nameEl = document.createElement('h3');
            nameEl.textContent = m.id;
            header.appendChild(nameEl);

            var badge = document.createElement('span');
            badge.className = 'badge';
            if (m.loaded) {
                badge.className += ' badge-loaded';
                badge.textContent = 'loaded';
            } else if (m.cached) {
                badge.className += ' badge-cached';
                badge.textContent = 'cached';
            } else {
                badge.className += ' badge-unloaded';
                badge.textContent = 'unloaded';
            }
            header.appendChild(badge);
            card.appendChild(header);

            if (m.dtype) {
                var dtypeRow = document.createElement('div');
                dtypeRow.className = 'model-row';
                dtypeRow.innerHTML = '<span>Dtype</span><span class="val">' + esc(m.dtype) + '</span>';
                card.appendChild(dtypeRow);
            }

            if (m.loaded && (m.gpu_name || m.gpu_memory_total)) {
                var gpuRow = document.createElement('div');
                gpuRow.className = 'model-row';
                var gpuText = m.gpu_name || 'GPU';
                if (m.gpu_memory_free != null && m.gpu_memory_total != null) {
                    gpuText += ' \u2014 ' + fmtMB(m.gpu_memory_free) + ' / ' + fmtMB(m.gpu_memory_total) + ' MB free';
                }
                gpuRow.innerHTML = '<span>GPU</span><span class="val">' + esc(gpuText) + '</span>';
                card.appendChild(gpuRow);
            }

            if (m.loaded && m.memory_used_mb > 0) {
                var memLabel = document.createElement('div');
                memLabel.className = 'model-row';
                memLabel.innerHTML = '<span>Memory Used</span><span class="val">' + fmt(m.memory_used_mb, 0) + ' MB</span>';
                card.appendChild(memLabel);

                var memBar = document.createElement('div');
                memBar.className = 'mem-bar';
                var memFill = document.createElement('div');
                memFill.className = 'mem-bar-fill blue';
                var pct = data.total_gpu_memory_mb > 0 ? Math.min((m.memory_used_mb / data.total_gpu_memory_mb) * 100, 100) : 0;
                memFill.style.width = pct + '%';
                memBar.appendChild(memFill);
                card.appendChild(memBar);
            }

            if (m.partition) {
                var partRow = document.createElement('div');
                partRow.className = 'model-row';
                partRow.innerHTML = '<span>Partition</span><span class="val">Layers ' + m.partition.start_layer + '\u2013' + m.partition.end_layer + '</span>';
                card.appendChild(partRow);
            }

            if (m.version) {
                var verRow = document.createElement('div');
                verRow.className = 'model-row';
                verRow.innerHTML = '<span>Version</span><span class="val">' + esc(m.version.version_id) + ' (' + esc(m.version.status) + ')</span>';
                card.appendChild(verRow);
            }

            if (m.cached) {
                var cacheRow = document.createElement('div');
                cacheRow.className = 'model-row';
                var sizeStr = m.cached.size_bytes ? fmtMB(m.cached.size_bytes) + ' MB' : '--';
                cacheRow.innerHTML = '<span>Cached</span><span class="val">' + sizeStr + '</span>';
                card.appendChild(cacheRow);
            }

            var actions = document.createElement('div');
            actions.className = 'action-btns';

            if (!m.loaded) {
                var loadBtn = document.createElement('button');
                loadBtn.className = 'btn btn-green';
                loadBtn.textContent = 'Load';
                loadBtn.addEventListener('click', function() {
                    actionModel('load', m.id);
                });
                actions.appendChild(loadBtn);
            } else {
                var unloadBtn = document.createElement('button');
                unloadBtn.className = 'btn btn-red';
                unloadBtn.textContent = 'Unload';
                unloadBtn.addEventListener('click', function() {
                    actionModel('unload', m.id);
                });
                actions.appendChild(unloadBtn);
            }

            card.appendChild(actions);
            container.appendChild(card);
        });
    }

    function actionModel(action, modelId) {
        setStatus('Working...', 'loading');
        var url = '/api/models/' + action;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: modelId }),
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.error) {
                setStatus('Error', 'error');
                showToast(action + ' ' + modelId + ': ' + d.error, 'err');
            } else {
                setStatus('OK', 'ok');
                showToast(modelId + ' ' + action + 'ed successfully', 'ok');
                refresh();
            }
        })
        .catch(function(err) {
            setStatus('Error', 'error');
            showToast(action + ' ' + modelId + ': ' + err, 'err');
        });
    }

    function refresh() {
        clearTimeout(refreshTimer);
        setStatus('Loading...', 'loading');
        fetch('/api/models/registry')
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function(data) {
                renderSummary(data);
                renderCluster(data);
                renderModels(data);
                setStatus('OK', 'ok');
                scheduleRefresh();
            })
            .catch(function(err) {
                setStatus('Error', 'error');
                el('summary-cards').innerHTML = '';
                el('model-grid').innerHTML = '<div class="empty-state">Failed to load registry: ' + esc(err.message) + '</div>';
                scheduleRefresh();
            });
    }

    el('refresh-btn').addEventListener('click', function() { refresh(); });

    refresh();
})();
</script>
</body>
</html>
