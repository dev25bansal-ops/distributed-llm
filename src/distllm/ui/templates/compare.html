{% extends "base.html" %}

{% block title %}DistLLM - Model Comparison{% endblock %}

{% block content %}
<h1>Model Comparison Dashboard</h1>
<p>Compare outputs from different models or configurations side-by-side.</p>

<div class="comparison-container">
    <div class="comparison-controls">
        <div class="control-row">
            <div class="control-group">
                <label>Model A</label>
                <select id="model-a"><option value="distributed-llm">Loading...</option></select>
            </div>
            <div class="control-group">
                <label>Model B</label>
                <select id="model-b"><option value="distributed-llm">Loading...</option></select>
            </div>
            <div class="control-group">
                <label>Temperature</label>
                <input type="number" id="comp-temp" value="0.7" min="0" max="2" step="0.1">
            </div>
            <div class="control-group">
                <label>Max Tokens</label>
                <input type="number" id="comp-tokens" value="256" min="1" max="4096">
            </div>
        </div>
        <div class="prompt-row">
            <textarea id="comp-prompt" placeholder="Enter a prompt to compare..." rows="3"></textarea>
            <button id="compare-btn" onclick="runComparison()">Compare</button>
        </div>
    </div>

    <div id="results-area" style="display:none;">
        <div class="results-grid">
            <div class="result-card">
                <h3 id="model-a-title">Model A</h3>
                <div id="output-a" class="result-output"></div>
                <div id="stats-a" class="result-stats"></div>
            </div>
            <div class="result-card">
                <h3 id="model-b-title">Model B</h3>
                <div id="output-b" class="result-output"></div>
                <div id="stats-b" class="result-stats"></div>
            </div>
        </div>
        <div class="comparison-summary" id="comparison-summary"></div>
    </div>

    <div class="history-section">
        <h3>Comparison History</h3>
        <div id="history-list"></div>
    </div>
</div>

<style>
.comparison-container { max-width: 1200px; }
.comparison-controls { background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
.control-row { display: flex; gap: 16px; margin-bottom: 12px; }
.control-group { flex: 1; }
.control-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.control-group select, .control-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
.prompt-row { display: flex; gap: 12px; }
.prompt-row textarea { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; }
#compare-btn { padding: 10px 24px; background: #10a37f; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
#compare-btn:hover { background: #0d8c6d; }
#compare-btn:disabled { background: #ccc; }
.results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.result-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; }
.result-card h3 { margin: 0 0 12px 0; color: #333; }
.result-output { min-height: 100px; padding: 12px; background: #f8f9fa; border-radius: 6px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
.result-stats { margin-top: 12px; font-size: 13px; color: #666; }
.comparison-summary { background: #e8f5e9; padding: 16px; border-radius: 8px; }
.history-section { margin-top: 30px; }
.history-item { padding: 12px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
.history-item:hover { background: #f8f9fa; }
</style>

<script>
const API_URL = '{{ api_url }}';
let history = [];

async function loadModels() {
    try {
        const res = await fetch(`${API_URL}/v1/models`);
        const data = await res.json();
        const models = data.data || [];
        const opts = models.map(m => `<option value="${m.id}">${m.id}</option>`).join('');
        document.getElementById('model-a').innerHTML = opts || '<option>distributed-llm</option>';
        document.getElementById('model-b').innerHTML = opts || '<option>distributed-llm</option>';
        if (models.length > 1) document.getElementById('model-b').selectedIndex = 1;
    } catch {}
}

async function runComparison() {
    const prompt = document.getElementById('comp-prompt').value.trim();
    if (!prompt) return;

    const modelA = document.getElementById('model-a').value;
    const modelB = document.getElementById('model-b').value;
    const temp = parseFloat(document.getElementById('comp-temp').value);
    const maxTokens = parseInt(document.getElementById('comp-tokens').value);

    const btn = document.getElementById('compare-btn');
    btn.disabled = true;
    btn.textContent = 'Comparing...';

    document.getElementById('results-area').style.display = 'block';
    document.getElementById('model-a-title').textContent = modelA;
    document.getElementById('model-b-title').textContent = modelB;
    document.getElementById('output-a').textContent = 'Generating...';
    document.getElementById('output-b').textContent = 'Generating...';

    try {
        const [resultA, resultB] = await Promise.all([
            generate(modelA, prompt, temp, maxTokens),
            generate(modelB, prompt, temp, maxTokens),
        ]);

        document.getElementById('output-a').textContent = resultA.text;
        document.getElementById('output-b').textContent = resultB.text;
        document.getElementById('stats-a').innerHTML = formatStats(resultA);
        document.getElementById('stats-b').innerHTML = formatStats(resultB);

        // Summary
        const faster = resultA.tps > resultB.tps ? 'A' : 'B';
        const diff = Math.abs(resultA.tps - resultB.tps).toFixed(1);
        document.getElementById('comparison-summary').innerHTML =
            `<strong>Summary:</strong> Model ${faster} was ${diff} tok/s faster. ` +
            `Model A: ${resultA.tokens} tokens in ${resultA.time.toFixed(1)}s | ` +
            `Model B: ${resultB.tokens} tokens in ${resultB.time.toFixed(1)}s`;

        // Add to history
        history.unshift({prompt, modelA, modelB, resultA, resultB, timestamp: new Date()});
        renderHistory();
    } catch (error) {
        document.getElementById('comparison-summary').innerHTML = `<span style="color:red">Error: ${error.message}</span>`;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Compare';
    }
}

async function generate(model, prompt, temperature, maxTokens) {
    const start = performance.now();
    const res = await fetch(`${API_URL}/v1/chat/completions`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            model,
            messages: [{role: 'user', content: prompt}],
            temperature,
            max_tokens: maxTokens,
        }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const time = (performance.now() - start) / 1000;
    const text = data.choices[0].message.content;
    const tokens = data.usage?.completion_tokens || 0;
    const tps = tokens > 0 ? tokens / time : 0;
    return {text, tokens, time, tps, model};
}

function formatStats(result) {
    return `Tokens: ${result.tokens} | Time: ${result.time.toFixed(1)}s | Speed: ${result.tps.toFixed(1)} tok/s`;
}

function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = history.slice(0, 10).map((h, i) =>
        `<div class="history-item" onclick="document.getElementById('comp-prompt').value='${h.prompt.replace(/'/g, "\\'")}'">
            <strong>${h.modelA}</strong> vs <strong>${h.modelB}</strong>: "${h.prompt.substring(0, 60)}..."
            <br><small>${h.timestamp.toLocaleTimeString()}</small>
        </div>`
    ).join('');
}

loadModels();
</script>
{% endblock %}
