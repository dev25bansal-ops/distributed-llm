[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-llm"
version = "0.4.1"
description = "Distributed LLM inference — pool GPUs across multiple devices to run models no single machine can handle"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Distributed LLM Contributors"},
]
keywords = [
    "llm",
    "inference",
    "distributed",
    "pipeline-parallelism",
    "gpu-sharing",
    "peer-to-peer",
    "open-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.109.0",
    # files/batch/fine-tuning routes use UploadFile/Form -> FastAPI requires
    # python-multipart at import time (RuntimeError without it); was only in
    # the [ui] extra, so lean installs crashed the whole api package.
    "python-multipart>=0.0.6",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    # PyJWT is required for JWT auth (the pure-Python HS256 fallback is only
    # a defense-in-depth path and must not be the primary validator).
    "pyjwt>=2.0.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    # The distributed layer is gRPC: node_service, node_client, block transfer,
    # tp_launcher, certificate_manager, retry and the generated node_pb2_grpc
    # all import grpc at module scope, and node_pb2 imports google.protobuf.
    # Neither was declared anywhere, so `pip install distllm` produced an
    # installation that could not start a coordinator or worker.
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    # Build-env floor (SEC-4 gate 2026-11-06): pip-audit flagged setuptools
    # 79.0.1 (PYSEC-2026-3447 fixed in 83.0.0; GHSA-xmj3-9gf7-h52w fixed in
    # 84.1.0) in the CI install env. Flooring clears both advisories.
    "setuptools>=84.1.0",
    # NOTE: typer and rich are in [cli] extras — not in core deps.
    # Core should be CLI-free so headless/library users don't pull
    # unnecessary dependencies.
    ]

[project.optional-dependencies]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-prometheus>=0.42b0",
]
self-hosted = [
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "sentencepiece>=0.1.99",
    "nvidia-ml-py>=12.0",
]
ray = [
    "ray[default]>=2.30.0",
]
backends = [
    # vllm <0.9.0: tight pin because vllm 0.x releases frequently
    # change internal APIs.  DistLLM's vllm backend uses the LLM
    # class and AsyncLLMEngine directly — neither is guaranteed
    # stable across minor versions.  Test before bumping.
    "vllm>=0.7.0,<0.9.0",
    # sglang <0.5.0: similar rationale — sglang is pre-1.0 and
    # makes breaking changes to its runtime API in minor releases.
    "sglang>=0.4.0,<0.5.0",
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.90",
    "pytest-benchmark>=4.0",
    "black==26.1.0",
    "ruff==0.16.7",
    "mypy>=1.8",
    "opentelemetry-test-utils>=0.42b0",
    "bandit[toml]>=1.7",
    "detect-secrets>=1.5",
    # Mirrors .github/workflows/dependency-scan.yml so devs can run
    # `pip-audit` locally against the same dependency gate.
    "pip-audit>=2.7",
]
sdk = [
    "httpx>=0.27.0",
]
cli = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
]
ui = [
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "qrcode[pil]>=7.4",
]
tokenize = [
    # /v1/tokenize — imported lazily; API returns 503 when absent
    "tiktoken>=0.7.0",
]
examples = [
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",
    "llama-index-llms-openai>=0.1.0",
    "llama-index-core>=0.10.0",
    "crewai>=0.30.0",
    # examples/haystack_example.py
    "haystack-ai>=2.0.0",
    # examples/agency_swarm_example.py (also uses the openai client directly)
    "agency-swarm>=0.2.0",
    # examples/openai_agents_example.py and examples/routed_inference.py
    "openai>=1.0.0",
]
security = [
    "cryptography>=41.0",
    "pynacl>=1.5.0",
]
moderation = [
    "transformers>=4.36.0",
    "onnxruntime>=1.16.0",
]
mlflow = [
    "mlflow>=2.0.0",
]
monitoring = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.21.0",
    "opentelemetry-proto>=1.21.0",
    "nvidia-ml-py>=12.0",
    "psutil>=5.9.0",
]
model-extras = [
    "bitsandbytes>=0.41.0",
    "peft>=0.14.0",
]
wan = [
    "aioquic>=1.0.0",
]
wandb = [
    "wandb>=0.18",
    "nvidia-ml-py>=12.0",
]
spark = [
    "pyspark>=3.4.0",
]
spark-mlflow = [
    "distributed-llm[spark,mlflow]",
]
openai-agents = [
    "openai-agents>=0.1.0",
    "openai>=1.0.0",
]
agno = [
    "agno>=1.0.0",
]
autogpt = [
    "autogpt>=0.4.0",
]
# Vector-database provider extras — only install the SDKs you need
vector-db-pinecone = [
    "pinecone>=3.0.0",
]
vector-db-qdrant = [
    "qdrant-client>=1.9.0",
]
vector-db-weaviate = [
    "weaviate-client>=4.0.0",
]
vector-db-milvus = [
    "pymilvus>=2.3.0",
]
vector-db-all = [
    "distributed-llm[vector-db-pinecone,vector-db-qdrant,vector-db-weaviate,vector-db-milvus]",
]
spot = [
    "httpx>=0.27",
]
all = [
    "distributed-llm[self-hosted,observability,ray,security,ui,backends,examples,openai-agents,agno,autogpt,wan,sdk,cli,spark,mlflow,spot]",
    "distributed-llm[model-extras]",
]
all-dev = [
    "distributed-llm[all,dev]",
    "locust>=2.20",
    "safety>=3.0",
]
# CI installs ".[dev,testing]": the ML stack below is REQUIRED here so the
# coverage measurement covers the complete import graph (torch/transformers
# are not core deps). Keep scripts/ci/import_assert.py in sync with the
# optional-dep allowlist.
testing = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "pytest-mock>=3.12",
    "hypothesis>=6.90",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "sentencepiece>=0.1.99",
    "nvidia-ml-py>=12.0",
    # Imported at module scope by tests/dist (test_byzantine_auth,
    # test_federated_merge, test_compression_fp8), so `pytest tests/dist`
    # could not even collect without them. cryptography is also a real runtime
    # dependency of certificate_manager, cert_rotation, webhooks and the cloud
    # providers.
    "cryptography>=41.0",
    "pynacl>=1.5.0",
    "zstandard>=0.22",
]

[project.scripts]
distllm = "distllm.cli.main:main"
distllm-coordinator = "distllm.core.coordinator:main"
distllm-api = "distllm.api.server:main"
distllm-node = "distllm.dist.worker:main"
distllm-cli-doctor = "distllm.cli.cli_doctor:main"

[project.urls]
Homepage = "https://github.com/distributed-llm/distributed-llm"
Documentation = "https://github.com/distributed-llm/distributed-llm#readme"
Repository = "https://github.com/distributed-llm/distributed-llm"
Issues = "https://github.com/distributed-llm/distributed-llm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["distllm*", "distllm.integrations*"]

# ── PEP 735 dependency groups ──────────────────────────────────────────────
#
# Install with `pip install --group dev distllm` (requires pip 25.1+).
# These mirror the [project.optional-dependencies] dev extra above so
# both `pip install 'distllm[dev]'` and `pip install --group dev` work.
#
# pep735 requires this table to be at the top level — the duplicate
# content is intentional so users can pick whichever form their tooling
# supports.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.90",
    "pytest-benchmark>=4.0",
    "black==26.1.0",
    "ruff==0.16.7",
    "mypy>=1.8",
    "opentelemetry-test-utils>=0.42b0",
    "bandit[toml]>=1.7",
    "detect-secrets>=1.5",
    # Mirrors .github/workflows/dependency-scan.yml so devs can run
    # `pip-audit` locally against the same dependency gate.
    "pip-audit>=2.7",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "hypothesis>=6.90",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
]
lint = [
    "black==26.1.0",
    "ruff==0.16.7",
    "mypy>=1.8",
    "bandit[toml]>=1.7",
    "detect-secrets>=1.5",
]
security = [
    "bandit[toml]>=1.7",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "ANN", "BLE", "SIM"]

# Kept for --statistics and editor feedback, but not gated:
#   ANN (1,502) - missing annotations; a backlog, not defects.
#   BLE (720)   - broad excepts; many are correct in supervisors/fallbacks.
#   F401 (479)  - unused imports. This codebase re-exports heavily through
#                 package __init__ and "backward-compatible re-export" blocks;
#                 ruff cannot see those uses and its autofix DELETES them,
#                 which broke 20+ imports when tried. Import hygiene here is
#                 enforced by the import smoke test, not by this rule.
#   E402 (48)   - imports after code; the re-export blocks sit there on purpose.
#   E501        - line length; the formatter owns it.
ignore = ["ANN", "BLE", "F401", "E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "N"]
"examples/*" = ["ANN", "N"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "build/",
    "dist/",
    "proto/",
    "tests/",
    "benchmarks/",
    "extensions/",
    "examples/",
    '.git',
 ]

[[tool.mypy.overrides]]
# Strict checking for core distributed modules
module = [
    "distllm.dist.pipeline",
    "distllm.dist.worker",
    "distllm.dist.recovery",
    "distllm.dist.straggler",
    "distllm.api.middleware",
    "distllm.config.settings",
    "distllm.security",
    "distllm.core.coordinator",
    "distllm.core.inference_engine",
    "distllm.core.cluster_manager",
    "distllm.core.health_manager",
    "distllm.core.metrics_collector",
    "distllm.core.request_pipeline",
    "distllm.models.partitioner",
    "distllm.api.server",
    "distllm.api.server_config",
]
disallow_untyped_defs = true
disallow_untyped_calls = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Suppress errors from Protobuf-generated code
module = [
    "distllm.dist.node_pb2",
    "distllm.dist.node_pb2_grpc",
]
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "build/*", "proto/*", "benchmarks/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    'if __name__ == .__main__.:',
    "raise NotImplementedError",
    "return None  # pragma: no cover",
]
fail_under = 80
skip_empty = true
