[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-llm"
version = "0.4.1"
description = "Distributed LLM inference — pool GPUs across multiple devices to run models no single machine can handle"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Distributed LLM Contributors"},
]
keywords = [
    "llm",
    "inference",
    "distributed",
    "pipeline-parallelism",
    "gpu-sharing",
    "peer-to-peer",
    "open-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    # PyJWT is required for JWT auth (the pure-Python HS256 fallback is only
    # a defense-in-depth path and must not be the primary validator).
    "pyjwt>=2.0.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    # NOTE: typer and rich are in [cli] extras — not in core deps.
    # Core should be CLI-free so headless/library users don't pull
    # unnecessary dependencies.
    ]

[project.optional-dependencies]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-prometheus>=0.42b0",
]
self-hosted = [
    "torch>=2.5.0",
    "transformers>=4.48.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "sentencepiece>=0.1.99",
    "nvidia-ml-py>=12.0",
]
ray = [
    "ray[default]>=2.30.0",
]
backends = [
    # vllm <0.9.0: tight pin because vllm 0.x releases frequently
    # change internal APIs.  DistLLM's vllm backend uses the LLM
    # class and AsyncLLMEngine directly — neither is guaranteed
    # stable across minor versions.  Test before bumping.
    "vllm>=0.7.0,<0.9.0",
    # sglang <0.5.0: similar rationale — sglang is pre-1.0 and
    # makes breaking changes to its runtime API in minor releases.
    "sglang>=0.4.0,<0.6.0",
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.90",
    "pytest-benchmark>=4.0",
    "black>=24.0",
    "ruff>=0.1.0",
    "mypy>=1.8",
    "opentelemetry-test-utils>=0.42b0",
    "bandit[toml]>=1.7",
    "detect-secrets>=1.5",
]
sdk = [
    "httpx>=0.27.0",
]
cli = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.0",
]
ui = [
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "qrcode[pil]>=7.4",
]
examples = [
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",
    "llama-index-llms-openai>=0.1.0",
    "llama-index-core>=0.10.0",
    "crewai>=0.30.0",
]
security = [
    "cryptography>=41.0",
    "pynacl>=1.5.0",
]
moderation = [
    "transformers>=4.36.0",
    "onnxruntime>=1.16.0",
]
mlflow = [
    "mlflow>=2.0.0",
]
monitoring = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.21.0",
    "opentelemetry-proto>=1.21.0",
    "nvidia-ml-py>=12.0",
    "psutil>=5.9.0",
]
model-extras = [
    "bitsandbytes>=0.41.0",
    "peft>=0.14.0",
]
wan = [
    "aioquic>=1.0.0",
]
wandb = [
    "wandb>=0.18",
    "nvidia-ml-py>=12.0",
]
spark = [
    "pyspark>=3.4.0",
]
spark-mlflow = [
    "distributed-llm[spark,mlflow]",
]
openai-agents = [
    "openai-agents>=0.1.0",
    "openai>=1.0.0",
]
agno = [
    "agno>=1.0.0",
]
autogpt = [
    "autogpt>=0.4.0",
]
# Vector-database provider extras — only install the SDKs you need
vector-db-pinecone = [
    "pinecone>=3.0.0",
]
vector-db-qdrant = [
    "qdrant-client>=1.9.0",
]
vector-db-weaviate = [
    "weaviate-client>=4.0.0",
]
vector-db-milvus = [
    "pymilvus>=2.3.0",
]
vector-db-all = [
    "distributed-llm[vector-db-pinecone,vector-db-qdrant,vector-db-weaviate,vector-db-milvus]",
]
spot = [
    "httpx>=0.27",
]
all = [
    "distributed-llm[self-hosted,observability,ray,security,ui,backends,examples,openai-agents,agno,autogpt,wan,sdk,cli,spark,mlflow,spot]",
    "distributed-llm[model-extras]",
]
all-dev = [
    "distributed-llm[all,dev]",
    "locust>=2.20",
    "safety>=3.0",
]

[project.scripts]
distllm = "distllm.cli.main:main"
distllm-coordinator = "distllm.core.coordinator:main"
distllm-api = "distllm.api.server:main"
distllm-node = "distllm.dist.worker:main"

[project.urls]
Homepage = "https://github.com/distributed-llm/distributed-llm"
Documentation = "https://github.com/distributed-llm/distributed-llm#readme"
Repository = "https://github.com/distributed-llm/distributed-llm"
Issues = "https://github.com/distributed-llm/distributed-llm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["distllm*", "distllm.integrations*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "ANN", "BLE", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "N"]
"examples/*" = ["ANN", "N"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_optional = true
show_error_codes = true
exclude = [
    "build/",
    "dist/",
    "proto/",
    "tests/",
    "benchmarks/",
    "extensions/",
    "examples/",
    '.git',
 ]

[[tool.mypy.overrides]]
# Strict checking for core distributed modules
module = [
    "distllm.dist.pipeline",
    "distllm.dist.worker",
    "distllm.dist.recovery",
    "distllm.dist.straggler",
    "distllm.api.middleware",
    "distllm.config.settings",
    "distllm.security",
    "distllm.core.coordinator",
    "distllm.core.inference_engine",
    "distllm.core.cluster_manager",
    "distllm.core.health_manager",
    "distllm.core.metrics_collector",
    "distllm.core.request_pipeline",
    "distllm.models.partitioner",
    "distllm.api.server",
]
disallow_untyped_defs = true
disallow_untyped_calls = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Suppress errors from Protobuf-generated code
module = [
    "distllm.dist.node_pb2",
    "distllm.dist.node_pb2_grpc",
]
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "build/*", "proto/*", "benchmarks/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    'if __name__ == .__main__.:',
    "raise NotImplementedError",
    "return None  # pragma: no cover",
]
fail_under = 80
skip_empty = true
