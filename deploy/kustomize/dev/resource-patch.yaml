# Dev: minimal coordinator resources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distllm-coordinator
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: coordinator
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2
              memory: 8Gi
---
# Dev: minimal worker resources, single replica
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distllm-worker
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: 1
              memory: 4Gi
            limits:
              cpu: 4
              memory: 16Gi
