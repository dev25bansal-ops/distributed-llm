apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distllm-worker
spec:
  # One replica: every worker gets the same --start-layer/--end-layer, so a
  # second pod would claim an overlapping range (topology_registry.
  # validate_assignment rejects that). Scale out with one StatefulSet per
  # pipeline stage, not a bigger replica count.
  replicas: 1
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: 2
              memory: 4Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 8
              memory: 16Gi
              nvidia.com/gpu: 1
