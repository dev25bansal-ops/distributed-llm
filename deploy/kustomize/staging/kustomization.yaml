apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distllm-staging

resources:
  - ../base

patches:
  - path: coordinator-resource-patch.yaml
    target:
      kind: Deployment
      name: distllm-coordinator
  - path: worker-resource-patch.yaml
    target:
      kind: StatefulSet
      name: distllm-worker

commonLabels:
  app.kubernetes.io/environment: staging
