apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distllm-worker
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
spec:
  serviceName: distllm-worker-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-llm
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-llm
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache-storage
          emptyDir: {}
      containers:
        - name: worker
          image: ghcr.io/distributed-llm/worker:0.4.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          ports:
            - containerPort: 50051
              name: grpc
          volumeMounts:
            - name: cache-storage
              mountPath: /var/cache/distllm
          env:
            # Entrypoint routes on DISTLLM_ROLE; distllm-node takes its
            # config as CLI flags (--node-id/--model/--start-* required).
            - name: DISTLLM_ROLE
              value: worker
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Workers fail closed without a cluster key (node_service.py:199).
            - name: DISTLLM_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: distllm-cluster-key
                  key: cluster-key
                  optional: true
          args:
            - --node-id
            - $(POD_NAME)
            - --coordinator-host
            - distllm-coordinator
            - --coordinator-port
            - "50050"
            - --port
            - "50051"
            - --model
            # Must match the coordinator's model. Change this literal (and
            # the layer split below) to your model before applying.
            - HuggingFaceTB/SmolLM-135M
            - --start-layer
            - "0"
            - --end-layer
            - "31"
            - --total-layers
            - "32"
            - --model-cache-dir
            - /var/cache/distllm
            - --insecure
          resources:
            requests:
              cpu: 1
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 4
              memory: 32Gi
              nvidia.com/gpu: 1
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Graceful drain: signal worker to finish in-flight requests
                command: ["/bin/sh", "-c", "kill -TERM 1 && sleep 10"]
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: distllm-worker-headless
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  clusterIP: None
