apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distllm

resources:
  - namespace.yaml
  - ../../operator/deployment.yaml
  - ../../operator/rbac.yaml
  - ../../operator/servicemonitor.yaml
  - ../../crds/distllm.zeroroute.ai_crds.yaml

commonLabels:
  app.kubernetes.io/name: distributed-llm
  app.kubernetes.io/part-of: distllm

configMapGenerator:
  - name: distllm-config
    literals:
      - DISTLLM_MODEL=roneneldan/TinyStories-1M
      - DISTLLM_DTYPE=float16

patches:
  - path: operator-patch.yaml
    target:
      kind: Deployment
      name: distllm-operator
