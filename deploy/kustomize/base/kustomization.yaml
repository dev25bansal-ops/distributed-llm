apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distllm

resources:
  - namespace.yaml
  - ../../inference/coordinator-deployment.yaml
  - ../../inference/worker-statefulset.yaml
  - ../../inference/pvc.yaml

commonLabels:
  app.kubernetes.io/name: distributed-llm
  app.kubernetes.io/part-of: distllm

configMapGenerator:
  - name: distllm-config
    literals:
      - DISTLLM_MODEL=HuggingFaceTB/SmolLM-135M
      - DISTLLM_DTYPE=float16
      - DISTLLM_QUANTIZATION_ENABLED=false
      - DISTLLM_RATE_LIMIT_ENABLED=true
      - DISTLLM_DEGRADATION_ENABLED=true

patches:
  - path: operator-patch.yaml
    target:
      kind: Deployment
      name: distllm-coordinator
  - path: operator-patch.yaml
    target:
      kind: StatefulSet
      name: distllm-worker
