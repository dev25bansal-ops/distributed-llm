apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distllm

# All resources live under this directory so a plain `kustomize build` (and
# ArgoCD / Flux, which use the default load restrictor) can build it. The
# manifests previously lived in deploy/inference/ and were referenced as
# ../../inference/*, which default Kustomize rejects.
resources:
  - namespace.yaml
  - coordinator-deployment.yaml
  - worker-statefulset.yaml
  - pvc.yaml
  - network-policy.yaml
  - coordinator-pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/name: distributed-llm
      app.kubernetes.io/part-of: distllm

# Keys are read through pydantic-settings: env_prefix "DISTLLM_" + nested
# delimiter "__". Verified empirically — DISTLLM_MODEL / DISTLLM_DTYPE were
# silently ignored (and a bare DISTLLM_MODEL crashes settings loading).
configMapGenerator:
  - name: distllm-config
    literals:
      - DISTLLM_MODEL__NAME=HuggingFaceTB/SmolLM-135M
      - DISTLLM_MODEL__DTYPE=float16
      - DISTLLM_RATE_LIMIT__ENABLED=true

patches:
  - path: coordinator-patch.yaml
    target:
      kind: Deployment
      name: distllm-coordinator
  - path: worker-patch.yaml
    target:
      kind: StatefulSet
      name: distllm-worker