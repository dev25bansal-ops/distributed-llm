apiVersion: apps/v1
kind: Deployment
metadata:
  name: distllm-coordinator
spec:
  template:
    spec:
      containers:
        - name: coordinator
          image: ghcr.io/distributed-llm/coordinator:0.4.0
          resources:
            requests:
              cpu: 2
              memory: 8Gi
            limits:
              cpu: 4
              memory: 16Gi
