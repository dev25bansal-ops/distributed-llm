# Patch operator deployment for production readiness
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distllm-operator
spec:
  template:
    spec:
      containers:
        - name: operator
          image: ghcr.io/distributed-llm/operator:0.4.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
