apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distllm-cache
  labels:
    app.kubernetes.io/name: distributed-llm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distllm-audit
  labels:
    app.kubernetes.io/name: distributed-llm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
