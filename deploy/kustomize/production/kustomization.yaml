apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distllm-production

resources:
  - ../base

patches:
  - path: resource-patch.yaml
    target:
      kind: Deployment
      name: distllm-coordinator
  - path: resource-patch.yaml
    target:
      kind: StatefulSet
      name: distllm-worker

images:
  - name: ghcr.io/distributed-llm/coordinator
    newTag: "0.4.0"
  - name: ghcr.io/distributed-llm/worker
    newTag: "0.4.0"

commonLabels:
  app.kubernetes.io/environment: production
