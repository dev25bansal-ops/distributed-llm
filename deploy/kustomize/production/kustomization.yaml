apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distllm-production

resources:
  - ../base

patches:
  - path: resource-patch.yaml
    target:
      kind: Deployment
      name: distllm-operator

images:
  - name: ghcr.io/distributed-llm/operator
    newTag: "0.4.0"

commonLabels:
  app.kubernetes.io/environment: production
