apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: distllm-production

resources:
  - ../base
  # HPA + Prometheus-adapter ConfigMap + ServiceMonitor (production only; it
  # needs prometheus-operator CRDs, dev/staging stay without them). Lives in
  # this directory rather than ../ so default kustomize can load it --
  # ArgoCD/Flux do not pass --load-restrictor.
  - autoscaling.yaml

patches:
  - path: coordinator-resource-patch.yaml
    target:
      kind: Deployment
      name: distllm-coordinator
  - path: worker-resource-patch.yaml
    target:
      kind: StatefulSet
      name: distllm-worker

images:
  - name: ghcr.io/distributed-llm/coordinator
    newTag: "0.4.1"

commonLabels:
  app.kubernetes.io/environment: production
