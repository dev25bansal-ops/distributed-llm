apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: distllm-worker-hpa
  namespace: distllm
  labels:
    app.kubernetes.io/name: distllm
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: distllm-worker
  minReplicas: 1
  maxReplicas: 16
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
  metrics:
    # Custom metrics from DistLLM pipeline
    - type: Pods
      pods:
        metric:
          name: distllm_in_flight_requests
        target:
          type: AverageValue
          averageValue: "10"
    - type: Pods
      pods:
        metric:
          name: distllm_gpu_utilization_percent
        target:
          type: AverageValue
          averageValue: "80"
    - type: Pods
      pods:
        metric:
          name: distllm_pipeline_latency_ms
        target:
          type: AverageValue
          averageValue: "5000"
    # External metrics from Prometheus
    - type: External
      external:
        metric:
          name: http_requests_per_second
          selector:
            matchLabels:
              service: distllm-api
        target:
          type: AverageValue
          averageValue: "100"
---
# Metrics API adapter for custom metrics
# Deploy this if using Prometheus Adapter
apiVersion: v1
kind: ConfigMap
metadata:
  name: distllm-metrics-config
  namespace: distllm
data:
  config.yaml: |
    rules:
      - seriesQuery: 'distllm_in_flight_requests{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "distllm_in_flight_requests"
          as: "distllm_in_flight_requests"
        metricsQuery: 'avg(distllm_in_flight_requests{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

      - seriesQuery: 'distllm_gpu_utilization_percent{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "distllm_gpu_utilization_percent"
          as: "distllm_gpu_utilization_percent"
        metricsQuery: 'avg(distllm_gpu_utilization_percent{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

      - seriesQuery: 'distllm_pipeline_latency_ms{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "distllm_pipeline_latency_ms"
          as: "distllm_pipeline_latency_ms"
        metricsQuery: 'avg(distllm_pipeline_latency_ms{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
---
# Webhook endpoint for custom metrics
apiVersion: v1
kind: Service
metadata:
  name: distllm-metrics-webhook
  namespace: distllm
spec:
  selector:
    app.kubernetes.io/name: distllm
    app.kubernetes.io/component: coordinator
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: webhook
      port: 8080
      targetPort: 8080
---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: distllm-metrics
  namespace: distllm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: distllm
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
