apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: distributed-llm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/distributed-llm/distributed-llm
    targetRevision: main
    path: deploy/kustomize/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: distllm-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
