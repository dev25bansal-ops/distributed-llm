# ArgoCD ApplicationSet driving one Application per environment (dev/staging/
# production) via a list generator. Go templates substitute per-element values.
# All three track master: this repo has no `release` branch and no v0.4.0 tag
# (only master + a v0.4.1 tag), so those refs would fail to sync. Staging and
# production keep autoSync disabled (manual, audited promotion).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: distllm-environments
spec:
  generators:
    - list:
        elements:
          - environment: dev
            namespace: distllm-dev
            revision: master
            autoSync: true
          - environment: staging
            namespace: distllm-staging
            revision: master
            autoSync: false
          - environment: production
            namespace: distllm-production
            revision: master
            autoSync: false
  template:
    metadata:
      name: distllm-{{environment}}
    spec:
      project: default
      source:
        repoURL: https://github.com/dev25bansal-ops/distributed-llm.git
        path: deploy/kustomize/{{environment}}
        targetRevision: '{{revision}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
