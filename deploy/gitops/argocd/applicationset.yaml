apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: distributed-llm
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: dev
            cluster: https://kubernetes.default.svc
            revision: main
            namespace: distllm-dev
            autoSync: true
          - environment: staging
            cluster: https://kubernetes.default.svc
            revision: release
            namespace: distllm-staging
            autoSync: true
          - environment: production
            cluster: https://kubernetes.default.svc
            revision: v0.4.0
            namespace: distllm-production
            autoSync: false
  template:
    metadata:
      name: "distributed-llm-{{environment}}"
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: default
      source:
        repoURL: https://github.com/distributed-llm/distributed-llm
        targetRevision: "{{revision}}"
        path: "deploy/kustomize/{{environment}}"
      destination:
        server: "{{cluster}}"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
