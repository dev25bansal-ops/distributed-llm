# Flux GitRepository: watches this repo's main branch for source changes.
# github-credentials (basic-auth Secret, managed by flux bot) is required
# because the repo may be private; public pulls still route via the same
# secret to keep one credential path.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: distllm-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/dev25bansal-ops/distributed-llm.git
  ref:
    branch: main
  secretRef:
    name: github-credentials
