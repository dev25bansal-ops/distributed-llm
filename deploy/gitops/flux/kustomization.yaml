apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: distllm
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/kustomize/${environment}
  prune: true
  sourceRef:
    kind: GitRepository
    name: distllm-repo
  healthChecks:
    - kind: Deployment
      name: distllm-operator
      namespace: distllm-${environment}
  postBuild:
    substitute:
      replica_count: "${replicas}"
      model_name: "${model_name}"
  dependsOn:
    - name: distllm-crds
