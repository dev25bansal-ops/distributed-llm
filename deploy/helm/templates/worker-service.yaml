{{- range $pool := .Values.nodePools }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distributed-llm.fullname" $ }}-worker-{{ $pool.name }}
  labels:
    {{- include "distributed-llm.labels" $ | nindent 4 }}
    {{- include "distributed-llm.workerLabels" (dict "root" $ "pool" $pool) | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "distributed-llm.workerLabels" (dict "root" $ "pool" $pool) | nindent 4 }}
{{- end }}
