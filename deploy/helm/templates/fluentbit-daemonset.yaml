{{- if .Values.logging.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "distllm.fullname" . }}-fluent-bit
  labels:
    {{- include "distllm.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging
spec:
  selector:
    matchLabels:
      {{- include "distllm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: logging
  template:
    metadata:
      labels:
        {{- include "distllm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: logging
    spec:
      serviceAccountName: {{ include "distllm.serviceAccountName" . }}
      containers:
        - name: fluent-bit
          image: "{{ .Values.logging.sidecarImage }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2020
              name: metrics
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
          env:
            - name: FLUENT_OUTPUT
              value: "{{ .Values.logging.output }}"
            {{- if eq .Values.logging.output "elasticsearch" }}
            - name: FLUENT_ELASTICSEARCH_HOST
              value: "{{ .Values.logging.elasticsearch.host }}"
            - name: FLUENT_ELASTICSEARCH_PORT
              value: "{{ .Values.logging.elasticsearch.port }}"
            {{- end }}
            {{- if eq .Values.logging.output "loki" }}
            - name: FLUENT_LOKI_URL
              value: "{{ .Values.logging.loki.url }}"
            {{- end }}
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlogpods
          hostPath:
            path: /var/log/pods
{{- end }}
