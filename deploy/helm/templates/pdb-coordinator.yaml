{{- if .Values.podDisruptionBudget.coordinator.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "distributed-llm.fullname" . }}-coordinator
  labels:
    {{- include "distributed-llm.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.coordinator.minAvailable }}
  selector:
    matchLabels:
      {{- include "distributed-llm.coordinatorLabels" . | nindent 6 }}
{{- end }}
