{{- if .Values.monitoring.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "distllm-operator.fullname" . }}-rules
  labels:
    app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: distllm.alerts
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(distllm_errors_total[5m]))
              / clamp_min(sum(rate(distllm_requests_total[5m])), 0.001) > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "DistLLM error rate above 5%"
        # FIX HIGH-P99-LATENCY: This rule was already correct. distllm_request_latency_seconds_bucket is automatically
        # emitted by prometheus_client Histogram as registered at exporter.py:23-29. No change needed.
        - alert: HighP99Latency
          expr: |
            histogram_quantile(0.99,
              sum(rate(distllm_request_latency_seconds_bucket[5m])) by (le)) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "DistLLM p99 request latency above 2s"
        - alert: NodeDown
          expr: distllm_node_health == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "DistLLM node reported unhealthy for 5m"
        - alert: LowThroughput
          expr: distllm_tokens_per_second < 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "DistLLM throughput below 100 tokens/s"
        # FIX CACHE-HIT-RATE-DROP: distllm_kv_cache_hit_rate NEVER EXISTS. Only distllm_kv_cache_usage_ratio is registered
        # at exporter.py:111-116, and the cache manager only tracks per-tier hit counts (_tier_stats.hits) that are never
        # exported. Alerting on a non-existent metric produces perpetual NO DATA. The rule is REMOVED rather than re-pointed
        # because no real cache hit-rate metric exists in the exporter.
        - alert: KVCachePressure
          expr: max(distllm_kv_cache_usage_ratio) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "KV cache usage ratio above 90% — consider more workers or a larger cache"
        - alert: DegradationActive
          expr: distllm_circuit_breaker_state > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "DistLLM degradation/circuit-breaker active"
        # FIX GPUMEMORYPRESSURE: distllm_node_gpu_memory_total_bytes NEVER EXISTS. Only distllm_node_gpu_memory_bytes (used) is
        # registered at exporter.py:65-70. There is no exported total-memory metric anywhere in exporter.py or populate_gauges().
        # This rule fires on NO DATA because the metric family doesn't exist.
        # Kept as a COMMENTED-BROKEN-TEMPLATE for reference — operators must implement GPU-total instrumentation first.
        # - alert: GPUMemoryPressure
        #   expr: |
        #     distllm_node_gpu_memory_bytes
        #       / clamp_min(distllm_node_gpu_memory_total_bytes, 1) > 0.9
        #   for: 10m
        #   labels:
        #     severity: warning
        #   annotations:
        #     summary: "GPU memory above 90% on a node"
        # FIX RATELIMITVIOLATIONS: distllm_errors_total has labels (type, model, tenant) — NO `code` label.
        # 429 rate-limiting responses are NOT recorded by the exporter at all (see middleware.py:344 — 429 is returned
        # directly without incrementing errors_total or any other counter). The errors counter only gets `.labels(type=...)`
        # from request_pipeline.py:372/377 and observability_middleware.py:134 — none use `code`.
        # This rule fires on NO DATA because the `code` label doesn't exist on any counter.
        # Kept as a COMMENTED-BROKEN-TEMPLATE for reference — operators must implement rate-limit instrumentation first.
        # - alert: RateLimitViolations
        #   expr: sum(rate(distllm_errors_total{code="429"}[5m])) > 1
        #   for: 10m
        #   labels:
        #     severity: info
        #   annotations:
        #     summary: "Sustained rate-limit rejections (429s)"
{{- end }}
