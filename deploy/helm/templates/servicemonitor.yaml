{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "distributed-llm.fullname" . }}
  labels:
    {{- include "distributed-llm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "distributed-llm.coordinatorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
