apiVersion: v1
kind: Service
metadata:
  name: {{ include "distllm.fullname" . }}-coordinator
  labels:
    {{- include "distllm.labels" . | nindent 4 }}
    {{- include "distllm.coordinatorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.coordinator.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.coordinator.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.coordinator.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "distllm.coordinatorLabels" . | nindent 4 }}
