{{- if .Values.coordinator.ha.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "distllm.fullname" . }}-coordinator
  labels:
    {{- include "distllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coordinator.ha.replicas }}
  serviceName: {{ include "distllm.fullname" . }}-coordinator-headless
  selector:
    matchLabels:
      {{- include "distllm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        {{- include "distllm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: coordinator
    spec:
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.coordinator.grpcPort }}
            - name: http
              containerPort: {{ .Values.coordinator.port }}
            - name: ha
              containerPort: {{ .Values.coordinator.ha.port }}
          env:
            - name: COORDINATOR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HA_ENABLED
              value: "true"
            - name: HA_PEERS
              value: "{{ range $i := until (int .Values.coordinator.ha.replicas) }}{{ if $i }},{{ end }}{{ include "distllm.fullname" $ }}-coordinator-{{ $i }}{{ end }}"
            - name: REDIS_URL
              value: {{ .Values.redis.url | default "redis://redis:6379/0" }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
{{- end }}
