apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distllm-operator.fullname" . }}
  labels: {{- include "distllm-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "distllm-operator.fullname" . }}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - --sync-period={{ .Values.controller.syncPeriod }}
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles }}
            - --leader-elect={{ .Values.operator.leaderElection.enabled }}
            - --leader-resource={{ .Values.operator.leaderElection.resourceName }}
            - --default-coordinator-image={{ .Values.controller.defaultCoordinatorImage }}
            - --default-worker-image={{ .Values.controller.defaultWorkerImage }}
            - --worker-grace-period={{ .Values.controller.workerGracePeriodSeconds }}
            - --coordinator-grace-period={{ .Values.controller.coordinatorGracePeriodSeconds }}
          ports:
            - containerPort: 9092
              name: metrics
              protocol: TCP
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distllm-operator.fullname" . }}-metrics
  labels: {{- include "distllm-operator.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
    app.kubernetes.io/component: operator
  ports:
    - port: {{ .Values.operator.metrics.port }}
      targetPort: metrics
      name: metrics
