{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "distllm.fullname" . }}-grafana-dashboard
  labels:
    {{- include "distllm.labels" . | nindent 4 }}
    {{ .Values.grafana.dashboard.label }}: "1"
data:
  distllm-performance.json: |
{{ .Files.Get "grafana-dashboards/distllm-performance.json" | indent 4 }}
  distllm-gpu.json: |
{{ .Files.Get "grafana-dashboards/distllm-gpu.json" | indent 4 }}
{{- end }}
