apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "distllm.fullname" . }}-config
  labels:
    {{- include "distllm.labels" . | nindent 4 }}
data:
  config.yaml: |
    model:
      name: {{ .Values.model.name }}
      dtype: {{ .Values.model.dtype }}
      trust_remote_code: {{ .Values.model.trustRemoteCode }}
    quantization:
      enabled: {{ .Values.quantization.enabled }}
      method: {{ .Values.quantization.method }}
      bits: {{ .Values.quantization.bits }}
    request_auditor:
      enabled: {{ .Values.requestAuditor.enabled }}
      max_entries: {{ .Values.requestAuditor.maxEntries }}
      enable_pii_detection: {{ .Values.requestAuditor.enablePiiDetection }}
      log_dir: {{ .Values.requestAuditor.logDir }}
    prompt_cache:
      enabled: {{ .Values.promptCache.enabled }}
      redis_url: {{ .Values.promptCache.redisUrl }}
      memory_cache_size: {{ .Values.promptCache.memoryCacheSize }}
      default_ttl_s: {{ .Values.promptCache.defaultTtlSeconds }}
    graceful_degradation:
      enabled: {{ .Values.gracefulDegradation.enabled }}
      light_threshold: {{ .Values.gracefulDegradation.lightThreshold }}
      moderate_threshold: {{ .Values.gracefulDegradation.moderateThreshold }}
      severe_threshold: {{ .Values.gracefulDegradation.severeThreshold }}
      critical_threshold: {{ .Values.gracefulDegradation.criticalThreshold }}
      fallback_model: "{{ .Values.gracefulDegradation.fallbackModel }}"
    adaptive_batching:
      enabled: {{ .Values.adaptiveBatching.enabled }}
      p50_latency_ms: {{ .Values.adaptiveBatching.p50LatencyMs }}
      p99_latency_ms: {{ .Values.adaptiveBatching.p99LatencyMs }}
      max_batch_size: {{ .Values.adaptiveBatching.maxBatchSize }}
    request_fingerprinting:
      enabled: {{ .Values.requestFingerprinting.enabled }}
      cache_size: {{ .Values.requestFingerprinting.cacheSize }}
      cache_ttl_s: {{ .Values.requestFingerprinting.cacheTtlSeconds }}
    rate_limiter:
      enabled: {{ .Values.rateLimiter.enabled }}
      default_rate: {{ .Values.rateLimiter.defaultRate }}
      default_burst: {{ .Values.rateLimiter.defaultBurst }}
      enable_backoff: {{ .Values.rateLimiter.enableBackoff }}
    redis:
      url: {{ .Values.redis.url }}
    warmup:
      enabled: {{ .Values.warmup.enabled }}
      auto_trigger: {{ .Values.warmup.autoTrigger }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "distllm.fullname" . }}-warmup
  labels:
    {{- include "distllm.labels" . | nindent 4 }}
data:
  warmup-hot.json: |
    [
      "Explain the theory of relativity in simple terms",
      "Write a poem about artificial intelligence",
      "What is the meaning of life?"
    ]
  warmup-warm.json: |
    [
      "Summarize the plot of Hamlet",
      "What is machine learning?"
    ]
