apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distributed-llm.fullname" . }}-coordinator
  labels:
    {{- include "distributed-llm.labels" . | nindent 4 }}
    {{- include "distributed-llm.coordinatorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      {{- include "distributed-llm.coordinatorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.updateStrategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.updateStrategy.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "distributed-llm.coordinatorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: coordinator
    spec:
      serviceAccountName: {{ include "distributed-llm.fullname" . }}
      terminationGracePeriodSeconds: {{ .Values.updateStrategy.terminationGracePeriodSeconds }}
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["distllm-coordinator"]
          args:
            - --model
            - {{ .Values.model.name | quote }}
            - --port
            - {{ .Values.coordinator.grpcPort | quote }}
            - --dtype
            - {{ .Values.model.dtype | quote }}
            {{- if .Values.model.trustRemoteCode }}
            - --trust-remote-code
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.coordinator.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.coordinator.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.coordinator.metricsPort }}
              protocol: TCP
          env:
            - name: DISTLLM_MODEL
              value: {{ .Values.model.name | quote }}
            - name: DISTLLM_DTYPE
              value: {{ .Values.model.dtype | quote }}
            {{- if .Values.quantization.enabled }}
            - name: DISTLLM_QUANTIZATION
              value: {{ .Values.quantization.method | quote }}
            - name: DISTLLM_QUANT_BITS
              value: {{ .Values.quantization.bits | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 30"]
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
