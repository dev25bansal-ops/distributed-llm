# Default values for distllm-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ── Operator deployment ───────────────────────────────────────────────

operator:
  name: distllm-operator
  replicaCount: 1
  image:
    repository: ghcr.io/distributed-llm/operator
    tag: "0.4.1"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: distllm-operator
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  leaderElection:
    enabled: true
    resourceName: distllm-operator-leader
  metrics:
    port: 9092
    serviceMonitor:
      enabled: false
      interval: 30s

# ── Controller reconciliation ─────────────────────────────────────────

controller:
  # How often to reconcile DistrubutedLLMCluster resources.
  syncPeriod: 5m
  # Max concurrent reconciles.
  maxConcurrentReconciles: 3
  # Default images when not specified in the CR.
  defaultCoordinatorImage: ghcr.io/distributed-llm/coordinator:0.4.1
  defaultWorkerImage: ghcr.io/distributed-llm/worker:0.4.1
  # Grace period for worker pod termination.
  workerGracePeriodSeconds: 30
  # Grace period for coordinator pod termination.
  coordinatorGracePeriodSeconds: 60

# ── Default resource templates (used when CR omits resources) ─────────

defaultResources:
  coordinator:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"
  worker:
    requests:
      cpu: "1"
      memory: "16Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "4"
      memory: "32Gi"
      nvidia.com/gpu: "1"

# ── Network ───────────────────────────────────────────────────────────

network:
  coordinatorPort: 8000
  coordinatorGrpcPort: 50050
  workerGrpcPort: 50051
  metricsPort: 9091

# ── TLS ───────────────────────────────────────────────────────────────

tls:
  enabled: false
  certManager:
    enabled: false
    issuerName: distllm-selfsigned-issuer

# ── Model configuration (required by coordinator template) ─────────────

model:
  # Must be set by the user; an empty name renders DISTLLM_MODEL__NAME empty
  # and `--model` empty on workers. Set with --set model.name=<hf-id>.
  name: ""
  dtype: "float16"

# ── Worker pipeline partition ──────────────────────────────────────────
# distllm-node requires --start-layer/--end-layer/--total-layers. Every
# worker replica receives the SAME range below; the coordinator assigns
# pipeline stages dynamically. Set these to match your model's layer count
# (the 32-layer default matches the Llama-2-7b defaults in the compose files).
worker:
  startLayer: 0
  endLayer: 31
  totalLayers: 32

# ── HPA configuration (required by hpa.yaml template) ─────────────────

# Coordinator high availability. With ha.enabled=true the coordinator
# StatefulSet runs 3 replicas, matching the kustomize staging/production
# overlays. Declared here so the switch is discoverable from values.yaml and
# not only reachable through `--set` on the command line.
coordinator:
  ha:
    enabled: false

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  # Selector consumed by hpa.yaml: "queue_depth" or "tokens_per_second".
  metric: "queue_depth"
  targetValue: 10

# ── Monitoring configuration (required by servicemonitor/prometheusrules) ─

monitoring:
  prometheusRules:
    enabled: false
  serviceMonitor:
    enabled: false
