# Default values for distributed-llm

image:
  repository: ghcr.io/distributed-llm/coordinator
  tag: "0.4.0"
  pullPolicy: IfNotPresent

model:
  name: roneneldan/TinyStories-1M
  dtype: float16
  trustRemoteCode: false

quantization:
  enabled: false
  method: bitsandbytes  # bitsandbytes, awq, gptq
  bits: 4  # 4 or 8

coordinator:
  replicas: 1
  port: 8000
  grpcPort: 50050
  metricsPort: 9090
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

# Worker node pools — each pool runs a range of model layers
nodePools:
  - name: pool-0
    startLayer: 0
    endLayer: 3
    replicas: 1
    gpuType: "nvidia.com/gpu"
    gpuCount: 1
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
      limits:
        cpu: "8"
        memory: "32Gi"
        gpu: 1
  - name: pool-1
    startLayer: 4
    endLayer: 7
    replicas: 1
    gpuType: "nvidia.com/gpu"
    gpuCount: 1
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
      limits:
        cpu: "8"
        memory: "32Gi"
        gpu: 1

# Rolling update strategy (graceful drain + cordon)
updateStrategy:
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
  terminationGracePeriodSeconds: 120

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: distllm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

nodeSelector: {}

affinity: {}

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  coordinator:
    enabled: true
    minAvailable: 1
  worker:
    enabled: true
    minAvailable: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics
