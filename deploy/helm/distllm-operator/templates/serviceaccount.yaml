apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "distllm-operator.fullname" . }}
  labels: {{- include "distllm-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "distllm-operator.fullname" . }}
  labels: {{- include "distllm-operator.labels" . | nindent 4 }}
rules:
  # Manage our CRDs.
  - apiGroups: [distllm.zeroroute.ai]
    resources: [distributedllmclusters, distributedllmclusters/status, nodepools, nodepools/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # Manage child resources we create.
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, secrets, events, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "distllm-operator.fullname" . }}
  labels: {{- include "distllm-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "distllm-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "distllm-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
