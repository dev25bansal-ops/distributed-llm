apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "distllm-operator.fullname" . }}-coordinator
  labels: {{- include "distllm-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  serviceName: {{ include "distllm-operator.fullname" . }}-coordinator-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
        app.kubernetes.io/component: coordinator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: coordinator
          image: "{{ .Values.controller.defaultCoordinatorImage }}"
          ports:
            - containerPort: {{ .Values.network.coordinatorPort }}
              name: api
            - containerPort: {{ .Values.network.coordinatorGrpcPort }}
              name: grpc
            - containerPort: {{ .Values.network.metricsPort }}
              name: metrics
          env:
            - name: DISTLLM_MODEL
              value: {{ .Values.model.name }}
            - name: DISTLLM_DTYPE
              value: {{ .Values.model.dtype | default "float16" }}
          resources: {{- toYaml .Values.defaultResources.coordinator | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.network.coordinatorPort }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.network.coordinatorPort }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "kill -TERM 1 && sleep {{ .Values.controller.coordinatorGracePeriodSeconds }}"]
      terminationGracePeriodSeconds: {{ add .Values.controller.coordinatorGracePeriodSeconds 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distllm-operator.fullname" . }}-coordinator
  labels: {{- include "distllm-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: coordinator
spec:
  selector:
    app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
    app.kubernetes.io/component: coordinator
  ports:
    - port: {{ .Values.network.coordinatorPort }}
      targetPort: api
      name: api
    - port: {{ .Values.network.coordinatorGrpcPort }}
      targetPort: grpc
      name: grpc
