{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "distllm-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "distllm-operator.name" . }}
  endpoints:
    - port: coordinator-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
    - port: worker-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
{{- end }}
