apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distllm-worker
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
spec:
  serviceName: distllm-worker-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-llm
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-llm
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: cache-storage
          emptyDir: {}
      containers:
        - name: worker
          image: ghcr.io/distributed-llm/worker:0.4.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9091
              name: metrics
          volumeMounts:
            - name: cache-storage
              mountPath: /var/cache/distllm
          env:
            - name: DISTLLM_COORDINATOR_HOST
              value: distllm-coordinator
            - name: DISTLLM_COORDINATOR_PORT
              value: "50050"
            - name: DISTLLM_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 1
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 4
              memory: 32Gi
              nvidia.com/gpu: 1
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Graceful drain: signal worker to finish in-flight requests
                command: ["/bin/sh", "-c", "kill -TERM 1 && sleep 10"]
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: distllm-worker-headless
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9091
      targetPort: 9091
  clusterIP: None
