apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: distllm-worker
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
spec:
  serviceName: distllm-worker-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-llm
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-llm
        app.kubernetes.io/component: worker
    spec:
      volumes:
        - name: cache-storage
          persistentVolumeClaim:
            claimName: distllm-cache
            readOnly: false
      containers:
        - name: worker
          image: ghcr.io/distributed-llm/worker:0.4.0
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: cache-storage
              mountPath: /var/cache/distllm
          env:
            - name: DISTLLM_COORDINATOR_HOST
              value: distllm-coordinator
            - name: DISTLLM_COORDINATOR_PORT
              value: "50050"
            - name: DISTLLM_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 4
              memory: 8Gi
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: distllm-worker-headless
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: worker
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9090
      targetPort: 9090
  clusterIP: None
