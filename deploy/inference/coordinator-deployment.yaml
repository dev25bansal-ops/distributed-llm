apiVersion: apps/v1
kind: Deployment
metadata:
  name: distllm-coordinator
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-llm
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-llm
        app.kubernetes.io/component: coordinator
    spec:
      volumes:
        - name: config
          configMap:
            name: distllm-config
        - name: cache-storage
          persistentVolumeClaim:
            claimName: distllm-cache
            readOnly: false
      containers:
        - name: coordinator
          image: ghcr.io/distributed-llm/coordinator:0.4.0
          ports:
            - containerPort: 50050
              name: grpc
            - containerPort: 8000
              name: api
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/distllm/config
              readOnly: true
            - name: cache-storage
              mountPath: /var/cache/distllm
          env:
            - name: DISTLLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: distllm-config
                  key: DISTLLM_MODEL
            - name: DISTLLM_DTYPE
              valueFrom:
                configMapKeyRef:
                  name: distllm-config
                  key: DISTLLM_DTYPE
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: distllm-coordinator
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: coordinator
spec:
  selector:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: coordinator
  ports:
    - name: grpc
      port: 50050
      targetPort: 50050
    - name: api
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9090
      targetPort: 9090
