apiVersion: apps/v1
kind: Deployment
metadata:
  name: distllm-coordinator
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-llm
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-llm
        app.kubernetes.io/component: coordinator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: distllm-config
        - name: cache-storage
          emptyDir: {}
      containers:
        - name: coordinator
          image: ghcr.io/distributed-llm/coordinator:0.4.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          ports:
            - containerPort: 50050
              name: grpc
            - containerPort: 8000
              name: api
            - containerPort: 9091
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/distllm/config
              readOnly: true
            - name: cache-storage
              mountPath: /var/cache/distllm
          env:
            - name: DISTLLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: distllm-config
                  key: DISTLLM_MODEL
            - name: DISTLLM_DTYPE
              valueFrom:
                configMapKeyRef:
                  name: distllm-config
                  key: DISTLLM_DTYPE
          resources:
            requests:
              cpu: 2
              memory: 8Gi
            limits:
              cpu: 4
              memory: 16Gi
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Graceful drain: signal coordinator to stop accepting new
                # requests and wait for in-flight requests to complete
                command: ["/bin/sh", "-c", "kill -TERM 1 && sleep 15"]
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: distllm-coordinator
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: coordinator
spec:
  selector:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: coordinator
  ports:
    - name: grpc
      port: 50050
      targetPort: 50050
    - name: api
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9091
      targetPort: 9091
