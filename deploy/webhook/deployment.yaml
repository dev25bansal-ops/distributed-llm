apiVersion: apps/v1
kind: Deployment
metadata:
  name: distllm-webhook
  namespace: distllm-system
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-llm
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-llm
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: distllm-webhook
      containers:
        - name: webhook
          image: ghcr.io/dev25bansal-ops/distllm/operator:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: webhook
              protocol: TCP
          volumeMounts:
            - name: distllm-webhook-tls
              mountPath: /etc/webhook/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: distllm-webhook-tls
          secret:
            secretName: distllm-webhook-tls
