apiVersion: v1
kind: Service
metadata:
  name: distllm-webhook
  namespace: distllm-system
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: webhook
  ports:
    - name: webhook
      port: 443
      targetPort: 8443
      protocol: TCP
