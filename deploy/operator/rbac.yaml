apiVersion: v1
kind: ServiceAccount
metadata:
  name: distllm-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: distllm-operator
rules:
  - apiGroups: ["distllm.zeroroute.ai"]
    resources: ["distributedllmclusters", "nodepools"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["distllm.zeroroute.ai"]
    resources: ["distributedllmclusters/status", "nodepools/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: distllm-operator
subjects:
  - kind: ServiceAccount
    name: distllm-operator
    namespace: default
roleRef:
  kind: ClusterRole
  name: distllm-operator
  apiGroup: rbac.authorization.k8s.io
