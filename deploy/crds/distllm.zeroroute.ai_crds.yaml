apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: distributedllmclusters.distllm.zeroroute.ai
spec:
  group: distllm.zeroroute.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                model:
                  type: object
                  required: [name, layers]
                  properties:
                    name: { type: string }
                    layers: { type: integer }
                    tensor_parallel_size: { type: integer, default: 1 }
                    dtype: { type: string, default: "float16" }
                coordinator:
                  type: object
                  properties:
                    replicas: { type: integer, default: 1 }
                    port: { type: integer, default: 8000 }
                    grpc_port: { type: integer, default: 50050 }
                    image: { type: string, default: "distllm/coordinator:latest" }
                    resources:
                      type: object
                      properties:
                        gpu: { type: string, default: "1" }
                        memory: { type: string, default: "32Gi" }
                        cpu: { type: string, default: "4" }
                node_pools:
                  type: array
                  items:
                    type: object
                    required: [start_layer, end_layer]
                    properties:
                      start_layer: { type: integer }
                      end_layer: { type: integer }
                      replicas: { type: integer, default: 1 }
                      grpc_port: { type: integer, default: 50051 }
                      image: { type: string, default: "distllm/worker:latest" }
                tls_enabled: { type: boolean, default: false }
                api_key_secret: { type: string }
                hpa:
                  type: object
                  properties:
                    enabled: { type: boolean, default: false }
                    target_tps: { type: integer }
                    min_replicas: { type: integer, default: 1 }
                    max_replicas: { type: integer, default: 10 }
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model.name
        - name: Layers
          type: integer
          jsonPath: .spec.model.layers
        - name: Coordinators
          type: integer
          jsonPath: .spec.coordinator.replicas
  scope: Namespaced
  names:
    plural: distributedllmclusters
    singular: distributedllmcluster
    kind: DistributedLLMCluster
    shortNames: [distllm]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.distllm.zeroroute.ai
spec:
  group: distllm.zeroroute.ai
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [cluster_name, start_layer, end_layer]
              properties:
                cluster_name: { type: string }
                start_layer: { type: integer }
                end_layer: { type: integer }
                replicas: { type: integer, default: 1 }
                grpc_port: { type: integer, default: 50051 }
                image: { type: string }
                model_name: { type: string }
                total_layers: { type: integer }
                dtype: { type: string, default: "float16" }
                resources:
                  type: object
                  properties:
                    gpu: { type: string, default: "1" }
                    memory: { type: string, default: "32Gi" }
                    cpu: { type: string, default: "4" }
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.cluster_name
        - name: Layers
          type: string
          jsonPath: "{.spec.start_layer}-{.spec.end_layer}"
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
  scope: Namespaced
  names:
    plural: nodepools
    singular: nodepool
    kind: NodePool
    shortNames: [npool]
