# Karpenter EC2NodeClass for GPU worker nodes.
# Subnet/SG discovery is tag-based; create the Karpenter node IAM role and the
# discovery tags per the repo deployment guide before applying.
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: gpu-ec2-class
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/part-of: distllm
    app.kubernetes.io/component: worker
spec:
  # Bottlerocket: minimal, auto-updating container OS with GPU variant support.
  amiFamily: Bottlerocket
  # IAM role Karpenter assumes for launched instances (create via
  # deploy/scripts or IaC; must allow ECR pulls and SSM).
  role: distllm-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: distributed-llm
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: distributed-llm
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
