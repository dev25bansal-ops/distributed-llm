apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: gpu-ec2-class
spec:
  amiFamily: Bottlerocket
  role: "distllm-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "distllm-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "distllm-cluster"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  userData: |
    [settings.kubernetes]
    "cluster-name" = "distllm-cluster"
  tags:
    karpenter.sh/discovery: "distllm-cluster"
    app.kubernetes.io/name: distributed-llm
