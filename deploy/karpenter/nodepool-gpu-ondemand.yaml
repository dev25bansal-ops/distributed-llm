apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-ondemand-coordinator
  labels:
    app.kubernetes.io/name: distributed-llm
    app.kubernetes.io/component: coordinator
spec:
  template:
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      nodeClassRef:
        name: gpu-ec2-class
        kind: EC2NodeClass
      expireAfter: 720h
  limits:
    cpu: 100
    memory: 400Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
