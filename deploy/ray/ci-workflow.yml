name: Ray CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  RAY_VERSION: "2.30.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ray-project/setup-ray@v1
        with:
          version: ${{ env.RAY_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start Ray head node
        run: |
          ray start --head --port=6379 --dashboard-port=8265 --num-cpus=2
          ray status

      - name: Run Ray worker tests
        run: |
          python -m pytest tests/core/test_ray_worker.py -v --timeout=60

      - name: Run Ray coordinator tests
        run: |
          python -m pytest tests/core/test_ray_coordinator.py -v --timeout=120

      - name: Run Ray pipeline tests
        run: |
          python -m pytest tests/core/test_ray_pipeline.py -v --timeout=120

      - name: Run Ray integration tests
        run: |
          python -m pytest tests/ -k "ray" -v --timeout=300 || true

      - name: Stop Ray
        if: always()
        run: ray stop

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: python -m ruff check src/

      - name: MyPy check
        run: python -m mypy src/ --ignore-missing-imports || true

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ray-project/setup-ray@v1
        with:
          version: ${{ env.RAY_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start Ray head node
        run: ray start --head --port=6379 --num-cpus=2

      - name: Run Ray benchmarks
        run: |
          python benchmarks/ray_vs_grpc.py --num-trials 20 --num-runs 3 --output benchmarks/results/ray_ci_results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: ray-benchmark-results
          path: benchmarks/results/ray_ci_results.json

      - name: Stop Ray
        if: always()
        run: ray stop
