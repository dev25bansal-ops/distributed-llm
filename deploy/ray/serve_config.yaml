# Ray Serve Configuration for Distributed LLM
#
# QUARANTINED — this file cannot run as written.
#
# It imports distllm.core.ray_coordinator:deployment. That module has never
# existed, and no @serve.deployment class exists anywhere under src/, so
# `serve run deploy/ray/serve_config.yaml` fails at import. The Ray *backend*
# itself works — it is RayPipeline in src/distllm/dist/backends/ray.py, reached
# through the normal pipeline path, not through Ray Serve.
#
# Kept rather than deleted because the autoscaler.yaml beside it is live and
# this documents the intended Serve topology. Do not treat its failure as a
# broken installation. To use it: implement the deployment class, or change
# import_path to point at one that exists.
#
# Production deployment using Ray Serve's built-in HTTP proxy and autoscaling.
#
# Usage (once import_path resolves):
#   serve run deploy/ray/serve_config.yaml
#
# Or via Python:
#   serve.run(RayLLMDeployment.bind(coord), port=8000)

proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

applications:
  - name: distributed-llm

    # Import path for the deployment (must match ray_coordinator.py)
    import_path: distllm.core.ray_coordinator:deployment

    # Runtime environment (packages to install on all nodes)
    runtime_env:
      pip_packages:
        - torch>=2.5.0
        - transformers>=4.48.0
        - ray[default]>=2.30.0

    # Deployment configurations
    deployments:
      - name: RayLLMDeployment
        num_replicas: 1
        max_ongoing_requests: 100
        ray_actor_options:
          num_cpus: 2
        # Auto-scale config
        autoscaling_config:
          min_replicas: 1
          max_replicas: 2
          target_num_ongoing_requests_per_replica: 50
